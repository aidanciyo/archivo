<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El viaje del dato</title>
<meta name="description" content="Juego para repasar la UT5 de Big Data: 8 estaciones, 5 vidas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;0,800;1,400&family=Bungee&family=Doto:wght@700;900&display=swap">
<style>
:root{
  --bg:#EDF0F4; --bg-dot:rgba(17,26,44,.08);
  --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#111A2C; --ink-2:#46526A; --muted:#667189; --rule:#D3D9E3;
  --line:#F2A900; --line-ink:#855700; --line-soft:#FFF0C7; --on-line:#1B1303;
  --led-bg:#15120C; --led:#FFB21E; --led-dim:#5A4515;
  --ok:#13864F; --ok-bg:#E0F4E8; --bad:#D2362F; --bad-bg:#FCE6E3;
  --shadow:0 1px 2px rgba(17,26,44,.06),0 10px 28px rgba(17,26,44,.09);
  --radius:16px;
  --f-display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-led:"Doto","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1019; --bg-dot:rgba(238,242,248,.07);
    --surface:#141B28; --surface-2:#1A2333;
    --ink:#EEF2F8; --ink-2:#B6BFCF; --muted:#8A96AB; --rule:#2B3649;
    --line:#FFB81C; --line-ink:#FFC94D; --line-soft:#3A2D0E; --on-line:#1B1303;
    --ok:#3CCB84; --ok-bg:rgba(60,203,132,.14); --bad:#FF6B61; --bad-bg:rgba(255,107,97,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.38);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1019; --bg-dot:rgba(238,242,248,.07);
  --surface:#141B28; --surface-2:#1A2333;
  --ink:#EEF2F8; --ink-2:#B6BFCF; --muted:#8A96AB; --rule:#2B3649;
  --line:#FFB81C; --line-ink:#FFC94D; --line-soft:#3A2D0E; --on-line:#1B1303;
  --ok:#3CCB84; --ok-bg:rgba(60,203,132,.14); --bad:#FF6B61; --bad-bg:rgba(255,107,97,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.38);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.3px); background-size:22px 22px;
  font-family:var(--f-body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
img{max-width:100%}
button{font:inherit;color:inherit}
a{color:var(--line-ink);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.app{min-height:100%;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
.hud{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--rule);
  display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center;
  gap:10px 12px; padding:8px 16px 10px;
}
.lives{display:flex;gap:2px;align-items:center}
.heart{width:22px;height:22px;display:block;color:var(--bad)}
.heart.is-lost{color:var(--rule)}
.heart.is-breaking{animation:heartbreak .7s ease-out}
.heart.is-gained{animation:heartgain .7s ease-out}
.led{
  background-color:var(--led-bg); color:var(--led);
  background-image:radial-gradient(rgba(255,178,30,.10) 1px,transparent 1.2px); background-size:4px 4px;
  font-family:var(--f-led); font-weight:900; font-size:15px; letter-spacing:.04em; text-transform:uppercase;
  text-shadow:0 0 6px rgba(255,178,30,.55);
  border-radius:8px; padding:5px 10px; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.score{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.score small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score .streak{color:var(--line-ink)}
.iconbtn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface-2);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0;
}
.iconbtn svg{width:20px;height:20px}
.strip{grid-column:1/-1;display:flex;align-items:center;gap:0;padding-inline:4px}
.strip i{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);position:relative;z-index:1}
.strip b{flex:1 1 auto;height:4px;background:var(--line);margin-inline:-1px}
.strip i.done{background:var(--line)}
.strip i.now{background:var(--line);box-shadow:0 0 0 4px var(--line-soft);animation:pulse 1.6s ease-in-out infinite}

/* ---------- layout ---------- */
.main{width:100%;max-width:800px;margin-inline:auto;padding-inline:16px;padding-block:22px 48px;flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.lead{font-size:1.12rem;color:var(--ink-2);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.note{font-size:.86rem;color:var(--muted)}
.fade-in{animation:fadeup .35s ease-out both}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:50px;padding:12px 22px;border-radius:12px;border:2px solid transparent;
  font-weight:800;font-size:1.02rem;cursor:pointer;text-decoration:none;
  transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--line);color:var(--on-line);box-shadow:0 3px 0 var(--line-ink)}
.btn-primary:hover{box-shadow:0 5px 0 var(--line-ink);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--rule);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.kbd{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;padding:0 .35em;border-radius:6px;border:1px solid var(--rule);background:var(--surface-2);font-size:.78rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- start ---------- */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.title-big{font-family:var(--f-display);font-size:clamp(2.35rem,8.6vw,4.4rem);line-height:.98;letter-spacing:.005em}
.title-big span{display:block}
.title-line{position:relative;height:22px;margin-block:4px 2px}
.title-line::before{content:"";position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--line)}
.title-line i{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--ink)}
.title-line .packet{position:absolute;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--line-soft);animation:ride 6s ease-in-out infinite}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px}
.rule svg{flex:0 0 22px;width:22px;height:22px;color:var(--line-ink)}
.rule b{display:block;line-height:1.2}
.rule span{font-size:.86rem;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800}
.input{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--surface);color:var(--ink);width:100%;max-width:420px}
.input:focus{outline:none;border-color:var(--line)}
.avatars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.avatar{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:10px 12px;cursor:pointer}
.avatar .dot{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.avatar .dot svg{width:20px;height:20px}
.avatar b{display:block;line-height:1.2}
.avatar span{font-size:.8rem;color:var(--muted)}
.avatar[aria-pressed="true"]{border-color:var(--line);box-shadow:0 0 0 3px var(--line-soft)}
.avatar[aria-pressed="true"] .dot{background:var(--line);color:var(--on-line)}
.best{font-size:.9rem;color:var(--muted)}
.best b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- map ---------- */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:760px){.map-wrap{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.ledboard{background-color:var(--led-bg);background-image:radial-gradient(rgba(255,178,30,.10) 1px,transparent 1.2px);background-size:4px 4px;border-radius:14px;padding:14px 16px;color:var(--led);font-family:var(--f-led);font-weight:900;text-transform:uppercase;text-shadow:0 0 8px rgba(255,178,30,.5)}
.ledboard .l1{font-size:.9rem;letter-spacing:.08em;opacity:.8}
.ledboard .l2{font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.1;letter-spacing:.03em}
.map{list-style:none;margin:0;padding:0;position:relative}
.map li{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:10px;min-height:58px}
.map li::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:6px;background:var(--line)}
.map li:first-child::before{top:50%}
.map li:last-child::before{bottom:50%}
.map .stop{position:relative;z-index:1;margin-left:11px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:5px solid var(--ink)}
.map li.done .stop{background:var(--line)}
.map li.now .stop{background:var(--line);box-shadow:0 0 0 6px var(--line-soft)}
.map .sname{display:flex;flex-direction:column;line-height:1.2}
.map .sname b{font-weight:800}
.map .sname span{font-size:.84rem;color:var(--muted)}
.map li.next .sname b{color:var(--ink-2)}
.map li.next .sname span{color:var(--muted)}
.map li.done .sname b::after{content:" ✓";color:var(--ok)}
.map .is-boss .stop{border-color:var(--bad)}
.rider{position:absolute;left:5px;z-index:2;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 4px var(--line),0 6px 18px rgba(0,0,0,.25);transition:top .9s cubic-bezier(.6,.05,.25,1)}
.rider svg{width:20px;height:20px}

/* ---------- briefing ---------- */
.brief-head{display:flex;gap:14px;align-items:center}
.roundel{flex:0 0 auto;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--line);color:var(--on-line);font-family:var(--f-display);font-size:1.35rem;box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--ink)}
.brief-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,5vw,2.1rem)}
.brief p+p{margin-top:10px}
.brief h3{font-size:1.05rem;font-weight:800;margin-bottom:8px}
.key{background:var(--line-soft);color:var(--ink);padding:0 .25em;border-radius:4px;font-weight:800;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.quote{font-size:1.25rem;font-weight:800;line-height:1.35;border-left:0;padding:0}
.pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pairs li{display:grid;grid-template-columns:minmax(0,17ch) auto minmax(0,1fr);gap:8px;align-items:baseline}
.pairs li b{font-weight:800}
.pairs li i{font-style:normal;color:var(--line-ink);font-weight:800}
.bullets{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.video{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem}
.video svg{width:18px;height:18px;flex:0 0 18px}
.videos{display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.84rem;color:var(--ink-2);line-height:1.3}
.livecount{display:grid;gap:6px;margin-top:4px}
.livecount div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.livecount span{font-size:.8rem;letter-spacing:.06em}
.livecount b{font-size:1.35rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.v{background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.v .vl{font-family:var(--f-display);font-size:1.15rem;line-height:1.1}
.v .vl::first-letter{color:var(--line-ink)}
.v span{font-size:.9rem;color:var(--ink-2);line-height:1.35}
.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:center}
@media (min-width:620px){.flow{grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr)}}
.sources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.src{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-weight:700;font-size:.92rem}
.src svg{width:18px;height:18px;flex:0 0 18px;color:var(--line-ink)}
.arrow{justify-self:center;color:var(--muted)}
.arrow svg{width:28px;height:28px;display:block}
@media (max-width:619px){.arrow svg{transform:rotate(90deg)}}
.lake{border-radius:14px;padding:14px;text-align:center;color:var(--on-line);background:var(--line);position:relative;overflow:hidden}
.lake b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;display:block}
.lake span{font-size:.85rem;font-weight:700}
.lake::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-8px;height:22px;background:radial-gradient(circle at 10px -2px,transparent 12px,rgba(27,19,3,.14) 13px) 0 0/24px 22px repeat-x}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.def{border:1px dashed var(--rule);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--ink-2)}
.def b{color:var(--ink);display:block}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-weight:700;line-height:1.3}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-size:.85rem}
.cluster{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.cluster .blk{width:46px;height:46px;border-radius:8px;background:var(--line);display:grid;place-items:center;color:var(--on-line);font-weight:800;font-size:.72rem;text-align:center;line-height:1.1}
.cluster .nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
.cluster .node{height:46px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;position:relative;background:var(--surface)}
.cluster .node svg{width:20px;height:20px}
.cluster .node::after{content:"";position:absolute;top:-6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:2px;background:var(--line);animation:chunk 2.4s ease-in-out infinite}
.cluster .node:nth-child(2)::after{animation-delay:.2s}
.cluster .node:nth-child(3)::after{animation-delay:.4s}
.cluster .node:nth-child(4)::after{animation-delay:.6s}
.cluster .res{background:var(--ok);color:#fff}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.col{border-radius:12px;padding:14px;border:1px solid var(--rule);background:var(--surface-2)}
.col h3{display:flex;align-items:center;gap:8px}
.profile{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:14px}
.profile header{display:flex;gap:12px;align-items:center}
.profile .face{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.profile .face svg{width:26px;height:26px}
.profile header b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;line-height:1.1}
.profile .pf{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.92rem}
.profile .pf svg{width:16px;height:16px;flex:0 0 16px;color:var(--line-ink)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);fill:var(--ink-2);font-size:12px}
.chart .cv{font-weight:800;fill:var(--ink)}
.chart .ttl{font-weight:800;fill:var(--ink);font-size:13px}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .bar{fill:var(--line)}
.chart .bar:hover{fill:var(--line-ink)}
.sectors{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.sector{background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sector svg{width:22px;height:22px;color:var(--line-ink)}
.sector b{line-height:1.2}
.sector span{font-size:.86rem;color:var(--ink-2);line-height:1.35}
.bigstat{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bigstat b{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,8vw,3rem);line-height:1;color:var(--ink)}
.bigstat span{max-width:36ch;color:var(--ink-2)}

/* ---------- challenge ---------- */
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--surface);border:1px solid var(--rule);color:var(--ink-2)}
.chip.warm{background:var(--line-soft);border-color:transparent;color:var(--line-ink)}
.q{font-size:clamp(1.2rem,3.6vw,1.45rem);font-weight:800;line-height:1.3}
.ctx{color:var(--ink-2)}
.opts{display:grid;gap:10px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:13px 14px;
  font-size:1.03rem;line-height:1.35;color:var(--ink);transition:border-color .12s,background-color .12s,transform .12s;
}
.opt:hover:not([disabled]){border-color:var(--ink-2);transform:translateY(-1px)}
.opt[disabled]{cursor:default}
.opt .kbd{flex:0 0 auto}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-dim{opacity:.5}
.opt.is-sel{border-color:var(--line);box-shadow:0 0 0 3px var(--line-soft)}
.opt .tag{margin-left:auto;flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;background:var(--ok);color:#fff}
.blank{display:inline-block;min-width:7ch;border-bottom:3px solid var(--line);color:var(--line-ink);text-align:center;padding-inline:4px}
.feedback{border-radius:14px;padding:16px;border:2px solid;display:flex;flex-direction:column;gap:10px}
.feedback.ok{border-color:var(--ok);background:var(--ok-bg)}
.feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
.feedback .ft{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.08rem}
.feedback.ok .ft{color:var(--ok)}
.feedback.bad .ft{color:var(--bad)}
.feedback .ft svg{width:22px;height:22px}
.feedback p{color:var(--ink)}
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.match .mcol{display:flex;flex-direction:column;gap:8px}
.match .opt{font-size:.95rem;padding:11px 12px;min-height:54px}
.match .mcol:first-child .opt{font-weight:800}
.sortcard{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:22px 18px;text-align:center;font-size:1.2rem;font-weight:800;box-shadow:var(--shadow);min-height:96px;display:grid;place-items:center}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;cursor:pointer;background:var(--surface);border:2px dashed var(--ink-2);border-radius:14px;padding:12px;min-height:84px}
.bin:hover:not([disabled]){border-style:solid}
.bin[disabled]{cursor:default}
.bin .bl{font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bin .bh{font-size:.82rem;color:var(--muted);line-height:1.3}
.bin .got{display:flex;flex-wrap:wrap;gap:4px}
.bin .got span{font-size:.72rem;font-weight:700;background:var(--surface-2);border:1px solid var(--rule);border-radius:999px;padding:2px 8px;color:var(--ink-2)}
.bin.is-correct{border-color:var(--ok);border-style:solid;background:var(--ok-bg)}
.bin.is-wrong{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o}
.slots li{counter-increment:o;display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--rule);border-radius:12px;padding:8px 12px;color:var(--muted);font-weight:700}
.slots li::before{content:counter(o);flex:0 0 28px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:2px solid var(--rule);font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.slots li.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.slots li.filled::before{background:var(--ok);border-color:var(--ok);color:#fff}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.progress-dots i.on{background:var(--ink)}
.hl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.hl{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}}
.hlc{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:150px;box-shadow:var(--shadow)}
.hlc .who{font-weight:800;font-size:1.05rem;line-height:1.25}
.hlc .num{font-family:var(--f-display);font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05;font-variant-numeric:tabular-nums}
.hlc .unit{font-size:.84rem;color:var(--muted)}
.hlc.mystery .num{color:var(--line-ink)}
.vs{align-self:center;justify-self:center;font-family:var(--f-display);color:var(--muted)}
.hlbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* arcade */
.arena{position:relative;height:min(62vh,440px);min-height:320px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--rule);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.arena .drop{position:absolute;top:0;left:0;will-change:transform;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--surface);border:2px solid var(--ink);font-weight:800;font-size:.8rem;white-space:nowrap;box-shadow:var(--shadow)}
.arena .drop svg{width:18px;height:18px;padding:3px;border-radius:50%;background:var(--line);color:var(--on-line);box-sizing:content-box}
.arena .drop.fake{border-color:var(--bad);color:var(--bad)}
.arena .drop.fake svg{background:var(--bad);color:#fff}
.arena .bucket{position:absolute;bottom:10px;left:0;height:46px;border-radius:10px 10px 22px 22px;background:var(--line);color:var(--on-line);display:grid;place-items:center;font-family:var(--f-display);font-size:.9rem;will-change:transform;box-shadow:0 6px 0 var(--line-ink)}
.arena .pop{position:absolute;font-weight:800;font-size:.95rem;pointer-events:none;animation:popup .8s ease-out forwards}
.arena .pop.plus{color:var(--ok)}
.arena .pop.minus{color:var(--bad)}
.arena .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent)}
.arena .overlay .stack{max-width:420px;align-items:center}
.arcade-hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-variant-numeric:tabular-nums}
.arcade-hud .meter{flex:1 1 180px;height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden;align-self:center}
.arcade-hud .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}

/* boss */
.boss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--led-bg);color:#F4EEE2;border-radius:16px;padding:14px 16px}
.boss .eye{width:74px;height:74px;display:block}
.boss .eye.hit{animation:hit .45s ease-out}
.boss .eye.laugh{animation:laugh .6s ease-in-out}
.boss .bn{font-family:var(--f-display);font-size:1.05rem;line-height:1.1;color:var(--led)}
.boss .hp{height:12px;border-radius:999px;background:#3A2F1A;overflow:hidden;margin-top:8px}
.boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#FF6B61,#FFB21E);transition:width .35s ease-out}
.boss .bs{font-size:.8rem;opacity:.75;margin-top:4px;font-variant-numeric:tabular-nums}
.timer{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left center}
.timer.low i{background:var(--bad)}

/* results */
.big-result{font-family:var(--f-display);font-size:clamp(2.2rem,9vw,3.6rem);line-height:1}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.review li .rq{font-weight:800;line-height:1.35}
.review li .ra{font-size:.92rem;color:var(--ink-2);margin-top:4px}
.review li .ra b{color:var(--ok)}
.review li .rs{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ticket{position:relative;background:var(--surface);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--rule);max-width:560px;width:100%}
.ticket .tb{background:var(--line);color:var(--on-line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ticket .tb b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;line-height:1.1}
.ticket .tb span{font-family:var(--f-led);font-weight:900;font-size:1rem}
.ticket .tbody{padding:16px 18px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;border-bottom:2px dashed var(--rule)}
.ticket .tbody div span{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ticket .tbody div b{font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ticket .tbody .wide{grid-column:1/-1}
.ticket .stripe{height:22px;background:var(--ink);margin:12px 18px 6px;border-radius:4px;opacity:.9}
.ticket .tfoot{padding:0 18px 14px;font-family:var(--f-led);font-weight:900;font-size:.9rem;letter-spacing:.06em;color:var(--muted)}
.ticket::before,.ticket::after{content:"";position:absolute;top:calc(100% - 64px);width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket::before{left:-11px}
.ticket::after{right:-11px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* overlay drawer (apuntes during challenge) */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.55);display:flex;justify-content:center;align-items:flex-end}
.drawer .sheet{background:var(--bg);width:100%;max-width:820px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.drawer{align-items:center}.drawer .sheet{border-radius:18px;max-height:86vh}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-weight:700;animation:fadeup .25s ease-out;pointer-events:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;background:var(--bad);opacity:0}
.flash.go{animation:flash .45s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bins.many{grid-template-columns:minmax(0,1fr)}
.bins.many .bin{min-height:0;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 14px}
@media (min-width:640px){.bins.many{grid-template-columns:repeat(5,minmax(0,1fr))}.bins.many .bin{justify-content:center;text-align:center;min-height:56px}}
@media (max-width:640px){
  .sectors,.vgrid{grid-template-columns:1fr 1fr}
  .sectors>:last-child:nth-child(odd),.vgrid>:last-child:nth-child(odd){grid-column:1/-1}
}
.between{justify-content:space-between}
.sfb{min-height:1.6em;font-weight:700}
.sfb.ok{color:var(--ok)}
.sfb.bad{color:var(--bad)}
details.ra{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
details.ra summary{cursor:pointer;font-weight:800}
details.ra ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--ink-2)}
.notes-sec{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.notes-sec+.notes-sec{border-top:2px dashed var(--rule);padding-top:22px}

.cluster .blk.res{width:auto;min-width:46px;padding:0 8px}
.bullets{display:block;margin:0;padding-left:1.2em}
.bullets li+li{margin-top:4px}
details.ra ol{display:block}
details.ra li+li{margin-top:4px}
.arcade-hud svg{width:18px;height:18px;vertical-align:-3px}
.hbar{margin:0;display:grid;gap:10px}
.hbar figcaption{font-weight:800}
.hrow{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:2px 12px;align-items:center}
.hrow .hl{font-size:.88rem;color:var(--ink-2);line-height:1.3}
.ht{display:flex;align-items:center;gap:8px;min-width:0}
.ht i{display:block;height:18px;border-radius:0 4px 4px 0;background:var(--line);min-width:3px;flex:0 0 auto}
.ht b{font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:540px){.hrow{grid-template-columns:minmax(0,1fr)}}
.eye .pupil{animation:look 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}65%{transform:translateX(5px)}}
.hlbtns .btn{gap:8px}

#view:focus{outline:none}
.chip svg{width:14px;height:14px;flex:0 0 14px}
.col h3{margin-bottom:8px}
.col h3 svg{width:22px;height:22px;flex:0 0 22px;color:var(--line-ink)}
@media (max-width:540px){
  .pairs li{display:block}
  .pairs li i{margin-inline:.35em}
  .stat{padding:10px}
  .stat b{font-size:1.2rem}
  .stat span{font-size:.7rem}
}
.shake{animation:shake .42s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.45) rotate(-12deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}
@keyframes heartgain{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--line-soft)}50%{box-shadow:0 0 0 7px var(--line-soft)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ride{0%{left:0}50%{left:calc(100% - 24px)}100%{left:0}}
@keyframes chunk{0%{transform:translateY(-22px);opacity:0}30%{opacity:1}60%{transform:translateY(14px);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes popup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@keyframes flash{0%{opacity:.22}100%{opacity:0}}
@keyframes hit{0%{transform:scale(1)}25%{transform:scale(.82) rotate(-8deg);filter:brightness(2)}100%{transform:scale(1)}}
@keyframes laugh{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:420px){
  body{font-size:16px}
  .hud{gap:8px;padding-inline:12px}
  .led{font-size:13px;padding:5px 8px}
  .heart{width:19px;height:19px}
  .match{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:8px}
  .match .opt{font-size:.88rem;padding:10px}
}

<body>

  S.lives = Math.max(0, S.lives - 1);
  S.stMistakes++;

}

}

/* ---------- apuntes de la estación ---------- */
function buildPlan(st){
  var out = [];
  st.challenges.forEach(function(c){
    if (c.type === 'pick') shuffle(c.from).slice(0, c.n).forEach(function(x){ out.push(prep(x)); });
    else out.push(prep(c));
  });
  return out;
}
function prep(c){
  var x = clone(c);
  if (x.type === 'sort'){
    var items = x.items;
    if (x.pick && x.pick < items.length){
      var chosen = [];
      if (x.ensure) Object.keys(x.ensure).forEach(function(b){
        chosen = chosen.concat(shuffle(items.filter(function(i){ return i.bin === b; })).slice(0, x.ensure[b]));
      });
      var rest = shuffle(items.filter(function(i){ return chosen.indexOf(i) < 0; }));
      items = chosen.concat(rest.slice(0, x.pick - chosen.length));
    }
    x.items = shuffle(items);
  }
  return x;
}

function confetti(){
  if (reduced()) return;
  var cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  var ctx = cv.getContext('2d'); if (!ctx) { cv.remove(); return; }
  var dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.width = '100%'; cv.style.height = '100%';
  var cols = ['#FFB21E', '#F2A900', '#13864F', '#D2362F', '#3CCB84', '#6C7A93'], ps = [];
  for (var i = 0; i < 170; i++) ps.push({ x: W / 2 + (Math.random() - .5) * W * .35, y: H * .35, vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 15 - 4) * dpr, s: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: pick(cols) });
  var t0 = performance.now();
  function f(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(function(p){ p.vy += .35 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 3600) requestAnimationFrame(f); else cv.remove();
  }
  requestAnimationFrame(f);
}

  notesCharged = false;

}

function frame(c, inner, opts){

/* clasificar */

/* calentamiento: ¿más o menos por minuto? */
function renderHilo(c){
  var pool = shuffle(MINUTE), seq = [pool[0]], i;
  for (i = 1; i < pool.length && seq.length < c.rounds + 1; i++){
    var ratio = pool[i].v / seq[seq.length - 1].v;
    if (ratio > 1.25 || ratio < 0.8) seq.push(pool[i]);
  }
  for (i = 0; seq.length < c.rounds + 1 && i < pool.length; i++) if (seq.indexOf(pool[i]) < 0) seq.push(pool[i]);
  var r = 0, hits = 0;
  function round(){
    var A = seq[r], B = seq[r + 1], last = r + 1 >= c.rounds;
    frame(c, '<p class="eyebrow">Ronda ' + (r + 1) + ' de ' + c.rounds + '</p><p class="q">¿Qué pasa más veces en un minuto?</p>' +
      '<div class="hl"><div class="hlc"><span class="who">' + A.who + '</span><span class="num">' + A.d + '</span><span class="unit">cada minuto</span></div>' +
      '<div class="vs" aria-hidden="true">VS</div>' +
      '<div class="hlc mystery"><span class="who">' + B.who + '</span><span class="num" id="bn">?</span><span class="unit" id="bu">¿más o menos?</span></div></div>' +
      '<div class="hlbtns"><button class="btn btn-ghost" type="button" data-key="1" id="hUp">' + ico('up') + 'Más <span class="kbd">1</span></button><button class="btn btn-ghost" type="button" data-key="2" id="hDown">' + ico('down') + 'Menos <span class="kbd">2</span></button></div>');
    function answer(up){
      $('#hUp').disabled = true; $('#hDown').disabled = true;
      var ok = (B.v > A.v) === up;
      (up ? $('#hUp') : $('#hDown')).classList.add(ok ? 'is-correct' : 'is-wrong');
      countUp($('#bn'), B, function(){
        $('#bu').textContent = 'cada minuto';
        var txt = '<b>' + B.who + '</b>: ' + B.d + ' por minuto. <b>' + A.who + '</b>: ' + A.d + '.';
        var lbl = last ? 'Terminar' : 'Siguiente ronda';
        if (ok){ hits++; feedback({ ok: true, pts: good(50), text: txt, next: nextRound, label: lbl }); }
        else { bad(null); feedback({ ok: false, text: (B.v > A.v ? 'Era más. ' : 'Era menos. ') + txt, next: nextRound, label: lbl }); }
      });
    }
    $('#hUp').onclick = function(){ answer(true); };
    $('#hDown').onclick = function(){ answer(false); };
  }
  function nextRound(){ r++; if (r < c.rounds) round(); else finish(); }
  function finish(){
    frame(c, '<p class="eyebrow">Calentamiento terminado</p><p class="q">Has acertado ' + hits + ' de ' + c.rounds + '.</p>' +
      '<div class="card stack"><p>Y todo eso pasa en <b>un solo minuto</b>. Un día tiene 1.440 minutos: multiplica y te harás una idea del <span class="key">volumen</span> de datos que generamos y de la <span class="key">velocidad</span> a la que llegan.</p><p>Para manejar algo así hacen falta herramientas especiales. De eso va el Big Data.</p></div>');
    feedback({ ok: true, title: '¡Motor en marcha!', label: 'Seguir el viaje' });
  }
  round();
}
function countUp(el, item, done){
  if (reduced()){ el.textContent = item.d; done(); return; }
  var t0 = performance.now(), D = 900;
  function f(t){
    if (!el.isConnected) return;
    var p = Math.min(1, (t - t0) / D), v = item.v * (1 - Math.pow(1 - p, 3));
    el.textContent = v >= 1e6 ? fmt(v / 1e6) + ' millones' : fmt(v);
    if (p < 1) requestAnimationFrame(f); else { el.textContent = item.d; done(); }
  }
  requestAnimationFrame(f);
}

/* bonus arcade: llena el Data Lake */
function renderArcade(c){
  var GOAL = 15, DUR = 30;
  frame(c, '<p class="q">Llena el Data Lake</p>' +
    '<p class="ctx">Atrapa los datos que caen (likes, compras, GPS…) y esquiva los <b>bulos</b>: sin veracidad, los datos no sirven. Si guardas ' + GOAL + ' datos fiables en ' + DUR + ' segundos, ganas una vida.</p>' +
    '<div class="arcade-hud"><span>' + ico('clock') + ' <b id="aT">' + DUR + '</b> s</span><div class="meter" aria-hidden="true"><i id="aM"></i></div><span><b id="aN">0</b>/' + GOAL + ' fiables</span></div>' +
    '<div class="arena" id="arena"><div class="bucket" id="bucket">DATA LAKE</div>' +
      '<div class="overlay" id="aOv"><div class="stack" style="align-items:center"><p><b>Mueve el lago con el dedo, el ratón o las flechas ← →</b></p>' +
      '<div class="actions" style="justify-content:center"><button class="btn btn-primary" type="button" data-primary id="aGo">¡Empezar!</button><button class="btn btn-ghost" type="button" id="aSkip">Saltar el bonus</button></div></div></div>' +
    '</div>', { noNotes: true });
  var arena = $('#arena'), bucket = $('#bucket'), ov = $('#aOv');
  var W = 0, H = 0, bw = 120, bx = 0, drops = [], running = false, raf = 0, t0 = 0, last = 0, acc = 0, caught = 0, fakes = 0, keys = { l: 0, r: 0 };
  function setX(x){ bx = Math.max(bw / 2, Math.min(W - bw / 2, x)); bucket.style.transform = 'translateX(' + (bx - bw / 2) + 'px)'; }
  function size(){ W = arena.clientWidth; H = arena.clientHeight; bw = Math.max(96, Math.min(160, W * 0.26)); bucket.style.width = bw + 'px'; setX(bx || W / 2); }
  size();
  function onPtr(e){ if (!running) return; var rc = arena.getBoundingClientRect(); setX(e.clientX - rc.left); }
  arena.addEventListener('pointermove', onPtr);
  arena.addEventListener('pointerdown', onPtr);
  function isL(k){ return k === 'ArrowLeft' || k === 'a' || k === 'A'; }
  function isR(k){ return k === 'ArrowRight' || k === 'd' || k === 'D'; }
  function kd(e){ if (!running) return; if (isL(e.key)){ keys.l = 1; e.preventDefault(); } if (isR(e.key)){ keys.r = 1; e.preventDefault(); } }
  function ku(e){ if (isL(e.key)) keys.l = 0; if (isR(e.key)) keys.r = 0; }
  window.addEventListener('keydown', kd); window.addEventListener('keyup', ku); window.addEventListener('resize', size);
  cleanup.push(function(){ running = false; cancelAnimationFrame(raf); window.removeEventListener('keydown', kd); window.removeEventListener('keyup', ku); window.removeEventListener('resize', size); });
  function spawn(elapsed){
    var fake = Math.random() < 0.24, d = pick(fake ? DROPS_FAKE : DROPS_OK), el = document.createElement('div');
    el.className = 'drop' + (fake ? ' fake' : '');
    el.innerHTML = ico(d.icon) + '<span>' + d.t + '</span>';
    arena.appendChild(el);
    var w = el.offsetWidth, h = el.offsetHeight;
    var o = { el: el, w: w, h: h, x: Math.random() * Math.max(1, W - w), y: -h - 4, vy: 115 + 150 * elapsed / DUR + Math.random() * 50, fake: fake };
    el.style.transform = 'translate(' + o.x + 'px,' + o.y + 'px)';
    drops.push(o);
  }
  function pop(x, y, txt, cls){ var p = document.createElement('div'); p.className = 'pop ' + cls; p.textContent = txt; p.style.left = x + 'px'; p.style.top = y + 'px'; arena.appendChild(p); setTimeout(function(){ p.remove(); }, 800); }
  function loop(ts){
    if (!running) return;
    var dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
    var elapsed = (ts - t0) / 1000, left = Math.max(0, DUR - elapsed);
    $('#aT').textContent = Math.ceil(left);
    if (keys.l || keys.r) setX(bx + (keys.r - keys.l) * 460 * dt);
    acc += dt;
    var every = 0.6 - 0.28 * Math.min(1, elapsed / DUR);
    while (acc > every){ acc -= every; spawn(elapsed); }
    var top = H - 10 - 46;
    for (var i = drops.length - 1; i >= 0; i--){
      var d = drops[i];
      d.y += d.vy * dt;
      d.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';
      var bottom = d.y + d.h;
      if (bottom >= top + 6 && bottom <= top + 46 && d.x + d.w > bx - bw / 2 + 4 && d.x < bx + bw / 2 - 4){
        d.el.remove(); drops.splice(i, 1);
        if (d.fake){ fakes++; caught = Math.max(0, caught - 1); S.score = Math.max(0, S.score - 30); pop(bx - 34, top - 30, '−1 bulo', 'minus'); sfx.fake(); shake(bucket); }
        else { caught++; S.score += 10; pop(bx - 16, top - 30, '+10', 'plus'); sfx.grab(); }
        $('#aN').textContent = caught;
        $('#aM').style.width = Math.min(100, caught / GOAL * 100) + '%';
        $('#scoreNum').textContent = fmt(S.score);
      } else if (d.y > H + 10){ d.el.remove(); drops.splice(i, 1); }
    }
    if (left <= 0) return end();
    raf = requestAnimationFrame(loop);
  }
  function end(){
    running = false;
    drops.forEach(function(d){ d.el.remove(); }); drops = [];
    var win = caught >= GOAL, extra = '';
    if (win){
      if (gainLife()) extra = '¡Ganas una vida!';
      else { S.score += 150; extra = 'Ya tenías todas las vidas: te llevas 150 puntos extra.'; }
      sfx.win();
    }
    updateHUD();
    ov.hidden = false;
    ov.innerHTML = '<div class="stack" style="align-items:center"><p class="display" style="font-size:1.6rem">' + (win ? '¡Lago lleno!' : '¡Tiempo!') + '</p>' +
      '<p>Has guardado <b>' + caught + '</b> datos fiables y se han colado <b>' + fakes + '</b> bulos. ' + extra + '</p>' +
      '<p class="small muted">Cada like, compra o posición GPS es un dato que acaba en el Data Lake. Y ojo con los bulos: sin veracidad, los datos no sirven.</p>' +
      '<button class="btn btn-primary" type="button" data-primary id="aNext">Continuar ' + ico('arrow') + '</button></div>';
    $('#aNext').onclick = function(){ sfx.click(); nextChallenge(); };
    try { $('#aNext').focus({ preventScroll: true }); } catch (e) {}
  }
  $('#aGo').onclick = function(){
    sfx.click(); ov.hidden = true; size();
    if (arena.scrollIntoView) arena.scrollIntoView({ block: 'center', behavior: 'auto' });
    running = true; t0 = last = performance.now(); acc = 0.5;
    raf = requestAnimationFrame(loop);
  };
  $('#aSkip').onclick = function(){ sfx.click(); nextChallenge(); };
}

/* jefe final: el Algoritmo Sesgado */
function renderBoss(c){
  var HP = c.n, hp = HP, used = [], T = 15;
  function nextQ(){
    if (hp === 1 && used.indexOf('key') < 0){ used.push('key'); return BOSS_KEY; }
    var avail = [];
    for (var i = 0; i < BOSS.length; i++) if (used.indexOf(i) < 0) avail.push(i);
    if (!avail.length){ used = used.filter(function(u){ return u === 'key'; }); for (var j = 0; j < BOSS.length; j++) avail.push(j); }
    var k = pick(avail); used.push(k); return BOSS[k];
  }
  function ask(){
    var q = nextQ(), isTF = q.type === 'tf', opts = choiceOpts(q);
    frame(c, '<div class="boss" id="bossP">' + eyeSVG() + '<div><div class="bn">El Algoritmo Sesgado</div><div class="hp"><i id="hpBar" style="width:' + (hp / HP * 100) + '%"></i></div><div class="bs" id="bs">Le quedan ' + hp + ' de ' + HP + ' puntos de vida</div></div></div>' +
      '<div class="timer" id="tm" aria-hidden="true"><i id="tmi"></i></div>' +
      (isTF ? '<p class="eyebrow">¿Verdadero o falso?</p>' : '') + '<p class="q">' + q.q + '</p>' + optsHTML(opts, isTF), { noNotes: true });
    var tmi = $('#tmi'), tm = $('#tm'), t0 = performance.now(), raf = 0, over = false;
    function tick(t){
      if (over) return;
      var left = Math.max(0, T - (t - t0) / 1000);
      tmi.style.transform = 'scaleX(' + (left / T) + ')';
      tm.classList.toggle('low', left < 5);
      if (left <= 0){ resolve(null); return; }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    cleanup.push(function(){ over = true; cancelAnimationFrame(raf); });
    bindChoice(opts, function(ok){ resolve(ok); });
    function resolve(ok){
      if (over) return;
      over = true; cancelAnimationFrame(raf);
      var left = Math.max(0, T - (performance.now() - t0) / 1000);
      var eye = $('#bossP .eye');
      if (ok === null){
        $$('.opts .opt', view).forEach(function(x, i){ x.disabled = true; x.classList.add(opts[i].ok ? 'is-correct' : 'is-dim'); });
      }
      if (ok){
        var p = good(100 + Math.round(left * 10));
        hp--; sfx.hit();
        if (eye){ eye.classList.remove('hit'); void eye.getBoundingClientRect(); eye.classList.add('hit'); }
        $('#hpBar').style.width = (hp / HP * 100) + '%';
        $('#bs').textContent = hp ? ('Le quedan ' + hp + ' de ' + HP + ' puntos de vida') : '¡Derrotado!';
        if (hp <= 0) feedback({ ok: true, title: '¡Has derrotado al Algoritmo Sesgado! +' + p, text: q.explain, label: 'Fin de trayecto' });
        else feedback({ ok: true, pts: p, text: q.explain, next: ask, label: 'Siguiente pregunta' });
      } else {
        if (eye){ eye.classList.remove('laugh'); void eye.getBoundingClientRect(); eye.classList.add('laugh'); }
        var dead = bad({ q: q.q, a: rightText(opts) });
        var title = ok === null ? (dead ? 'Se acabó el tiempo… y las vidas' : 'Se acabó el tiempo. Pierdes una vida') : null;
        feedback({ ok: false, dead: dead, title: title, text: q.explain, next: ask, label: 'Siguiente pregunta' });
      }
    }
  }
  ask();
}

/* ---------- teclado ---------- */
document.addEventListener('keydown', function(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('#drawer')){ if (e.key === 'Escape') closeDrawer(); return; }
  var t = e.target;
  if (t && t.matches && t.matches('input, textarea, select')) return;
  var k = e.key;
  if ($('.opts.two', view)){ if (k === 'v' || k === 'V') k = '1'; else if (k === 'f' || k === 'F') k = '2'; }
  if (/^[1-9]$/.test(k)){
    var b = view.querySelector('[data-key="' + k + '"]:not([disabled]):not([hidden])');
    if (b){ e.preventDefault(); b.click(); }
    return;
  }
  if (k === 'Enter'){
    if (t && t.closest && t.closest('button, a, summary')) return;
    var p = view.querySelector('[data-primary]:not([disabled])');
    if (p && !p.closest('[hidden]')){ e.preventDefault(); p.click(); }
  }
});

/* ---------- arranque ---------- */
function boot(data){
  if (data && data.S && data.S.lives > 0 && data.S.st < STATIONS.length) resume(data.S);
  else renderStart();
}
try {
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function')
    window.claude.hot.snapshot(function(){ var s = snapshot(); return s ? { S: s } : {}; });
} catch (e) {}
try {
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
} catch (e) { boot({}); }
})();
</script>
