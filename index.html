<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión 4.0</title>
<meta name="description" content="Juego de repaso de la UT1 · Digitalización de los sectores productivos: 7 épocas, un jefe final y 5 vidas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================
   MISIÓN 4.0 · estilos
   Cada época tiene su paleta (data-era). Todo usa tokens.
   ============================================================ */
:root{
  color-scheme:dark;
  --on:#120E0A; --ok:#4ADE80; --bad:#FF5D5D; --heart:#FF4D6D; --gold:#FFD447;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Base: la máquina del tiempo */
:root,[data-era="0"]{--bg:#12131B;--panel:#1B1D29;--panel2:#232636;--line:#343850;--ink:#EDEEF6;--muted:#A6AAC2;--a1:#FFB547;--a2:#6EE7F9;--a3:#C29BFF;--glow:rgba(255,181,71,.13)}
/* 1 · Vapor: carbón y latón */
[data-era="1"]{--bg:#19130E;--panel:#241B14;--panel2:#2E231A;--line:#48372A;--ink:#F6EADA;--muted:#C4AD93;--a1:#E7A93E;--a2:#DB6C44;--a3:#F2D8A7;--glow:rgba(231,169,62,.16)}
/* 2 · Electricidad: noche y arco voltaico */
[data-era="2"]{--bg:#0F1128;--panel:#191C3B;--panel2:#212549;--line:#353A6C;--ink:#EEF0FF;--muted:#AAAED8;--a1:#FFD447;--a2:#7FA6FF;--a3:#F5F1D6;--glow:rgba(255,212,71,.14)}
/* 3 · Silicio: placa de circuito y pistas de oro */
[data-era="3"]{--bg:#08201A;--panel:#0E2C24;--panel2:#13372D;--line:#23533F;--ink:#E9F8F0;--muted:#A0C9B6;--a1:#F0C35A;--a2:#48E5A4;--a3:#9FE7FF;--glow:rgba(72,229,164,.12)}
/* 4 · Industria 4.0: red conectada */
[data-era="4"]{--bg:#0E1230;--panel:#171C47;--panel2:#1F2556;--line:#323A7A;--ink:#EEF1FF;--muted:#AAB2E0;--a1:#2FD6F2;--a2:#B18CFF;--a3:#FFD447;--glow:rgba(47,214,242,.14)}
/* 5 · Digitalización: del papel al píxel */
[data-era="5"]{--bg:#0E1433;--panel:#161F4D;--panel2:#1D285C;--line:#303E80;--ink:#EFF3FF;--muted:#AEB9E3;--a1:#5AB0FF;--a2:#C29BFF;--a3:#FFB547;--glow:rgba(90,176,255,.15)}
/* 6 · Ciberfísicos: sensor cian, actuador naranja */
[data-era="6"]{--bg:#061A22;--panel:#0B2631;--panel2:#10313F;--line:#1D4C60;--ink:#E6FAFF;--muted:#96C2CF;--a1:#2FD6F2;--a2:#FF9A3D;--a3:#B7F36B;--glow:rgba(47,214,242,.14)}
/* 7 · Gemelo digital */
[data-era="7"]{--bg:#0A1E1E;--panel:#102B2B;--panel2:#153535;--line:#24524F;--ink:#E8FBF8;--muted:#97C4BE;--a1:#5CE1C9;--a2:#FF8FB1;--a3:#FFD166;--glow:rgba(92,225,201,.13)}
/* 8 · IT (verde) y OT (naranja) */
[data-era="8"]{--bg:#111519;--panel:#1A2026;--panel2:#222A31;--line:#36424D;--ink:#EEF3F6;--muted:#A5B4C0;--a1:#3FD08A;--a2:#FF7A3D;--a3:#4C8DFF;--glow:rgba(76,141,255,.13)}
/* 9 · Balance */
[data-era="9"]{--bg:#141221;--panel:#1E1B30;--panel2:#262239;--line:#3C3757;--ink:#F3F0FB;--muted:#B5ADCD;--a1:#4FE0C8;--a2:#FF6F6F;--a3:#FFD166;--glow:rgba(79,224,200,.12)}
/* 10 · Desafío final */
[data-era="10"]{--bg:#17060F;--panel:#250A19;--panel2:#2F0E21;--line:#521A3A;--ink:#FFEAF3;--muted:#D8A0BC;--a1:#FF2E88;--a2:#FFD166;--a3:#7CE7FF;--glow:rgba(255,46,136,.16)}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  min-height:100%;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--bg);color:var(--ink);
  font:400 17px/1.55 var(--f-body);
  background-image:
    radial-gradient(1100px 460px at 50% -140px,var(--glow),transparent 72%),
    linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:auto,28px 28px,28px 28px;
  background-attachment:fixed,fixed,fixed;
  transition:background-color .7s ease;
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a2);outline-offset:3px}
.wrap{max-width:780px;margin:0 auto;padding-block:18px 56px}
.eyebrow{font:600 12px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.block{display:block;margin:6px 0 -4px}
.h-display{font:800 clamp(30px,6.6vw,46px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.muted{color:var(--muted)}
.center{text-align:center}
.small{font-size:14px}

/* ---------- iconos ---------- */
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.ic-heart,.ic-star,.ic-play{fill:currentColor;stroke:none}

/* ---------- botones ---------- */
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:12px;background:var(--a1);color:var(--on);font:700 17px/1.15 var(--f-body);padding:14px 20px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 8px 22px -12px var(--a1);transition:transform .08s ease,filter .15s ease,box-shadow .15s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--a1);filter:none}
.btn.big{font-size:19px;min-height:58px;padding:16px 26px}
.btn.danger{color:var(--bad)}
.btn .ic{width:1.2em;height:1.2em}
.btn-stack{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.btn-stack small{font:600 12px/1 var(--f-mono);letter-spacing:.06em;opacity:.8;text-transform:uppercase}
.linkbtn{appearance:none;border:0;background:none;color:var(--a1);font:700 15px/1 var(--f-body);display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.icon-btn{appearance:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn .ic{width:22px;height:22px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row-btns.end{justify-content:flex-end}
kbd{font:600 12px/1 var(--f-mono)}

/* ---------- motivo: panel de control con piloto (LED) ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head > .eyebrow{flex:1 1 0;min-width:0}
.led{width:9px;height:9px;border-radius:50%;background:var(--a1);box-shadow:0 0 0 3px rgba(0,0,0,.28),0 0 12px var(--a1);flex:none}
@media (max-width:520px){.panel{padding:18px 16px}}

/* ---------- portada ---------- */
.title-screen{display:grid;gap:24px;padding-block:20px 56px}
.title-bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plates{display:flex;flex-wrap:wrap;gap:6px}
.plate{font:600 11px/1.35 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.logo{font:900 clamp(78px,22vw,172px)/.8 var(--f-display);text-transform:uppercase;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .14em;margin-top:4px}
.logo-a{color:var(--ink)}
.logo-b{background:linear-gradient(90deg,#E7A93E,#FFD447 24%,#48E5A4 46%,#2FD6F2 66%,#5AB0FF 82%,#FF2E88);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:clamp(18px,4.4vw,22px);line-height:1.45;max-width:34em}
.tagline b{color:#FF6FAE}
.eras{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.eras li{border-top:5px solid var(--c);padding-top:8px;display:grid;gap:3px}
.eras b{font:800 clamp(22px,4.6vw,30px)/1 var(--f-display);color:var(--c)}
.eras span{font:600 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:560px){.eras{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}}
.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45}
.rules .ic{width:26px;height:26px;color:var(--a1);margin-top:1px}
.rules .ic-heart{color:var(--heart)}
@media (max-width:560px){.rules{grid-template-columns:1fr}}
.start{display:grid;gap:12px}
.start input{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;font-size:18px}
.start input:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px rgba(255,181,71,.25)}
.best{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px}
.best .ic{color:var(--gold)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-width:780px;margin:10px auto 0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:0 12px 30px -18px rgba(0,0,0,.9)}
@supports (background:color-mix(in srgb,red 50%,transparent)){.hud{background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
.hud-left{display:flex;align-items:center;gap:10px;min-width:0}
.hud-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--a1);flex:none}
.hud-ico .ic{width:22px;height:22px}
.hud-title{display:grid;min-width:0}
.hud-title strong{font:800 21px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-title .eyebrow{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-right{display:flex;align-items:center;gap:10px}
.hearts{display:flex;gap:2px}
.heart{width:22px;height:22px;color:var(--heart);display:grid;place-items:center}
.heart .ic{width:22px;height:22px}
.heart.off{color:var(--line)}
.heart.breaking{animation:heartBreak .8s ease-out}
.heart.gain{animation:heartGain .9s ease-out}
.hud-score{display:grid;text-align:right;min-width:48px}
.hud-score .eyebrow{font-size:10px}
.hud-score b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hud-btn{appearance:none;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);height:40px;min-width:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;cursor:pointer;font:600 14px/1 var(--f-mono)}
.hud-btn .ic{width:20px;height:20px}
.hint-btn .ic{color:var(--gold)}
.hud-btn:disabled{opacity:.38;cursor:not-allowed}
.segs{grid-column:1/-1;display:flex;gap:4px}
.seg{flex:1;height:5px;border-radius:3px;background:var(--line)}
.seg.ok{background:var(--ok)}.seg.bad{background:var(--bad)}.seg.cur{background:var(--a1);box-shadow:0 0 8px var(--a1)}
@media (max-width:460px){
  .hud{padding:8px 10px;gap:8px}
  .hud-title{display:none}
  .hud-ico{width:34px;height:34px}
  .hud-right{gap:7px}
  .heart,.heart .ic{width:18px;height:18px}
  .hud-btn{height:38px;min-width:38px;padding:0 6px}
  .hud-score b{font-size:20px}
}

/* ---------- mapa del tiempo ---------- */
.map-head{display:grid;gap:8px;margin:22px 0 20px}
.rail{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.station{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start}
.station::after{content:"";position:absolute;left:27px;top:60px;bottom:-18px;width:3px;border-radius:2px;background:var(--line)}
.station:last-child::after{display:none}
.station.done::after{background:var(--st)}
.st-node{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
.st-node .ic{width:26px;height:26px}
.station.done .st-node{border-color:var(--st);color:var(--st)}
.station.cur .st-node{background:var(--st);border-color:var(--st);color:var(--on);animation:nodePulse 2s ease-in-out infinite}
.st-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.station.cur .st-card{border-color:var(--st);box-shadow:0 0 0 1px var(--st),0 14px 40px -24px var(--st)}
.st-card h3{font:800 25px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.st-card p{color:var(--muted);font-size:15px}
.station.locked .st-card{opacity:.55}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.stars{display:inline-flex;gap:2px;color:var(--line)}
.stars .on{color:var(--gold)}
.stars .ic{width:20px;height:20px}
.st-card .btn{margin-top:8px;justify-self:start}

/* ---------- intro de época ---------- */
.intro{display:grid;gap:14px;justify-items:start;padding-block:28px 56px}
.intro-badge{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:var(--a1);color:var(--on);box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 44px var(--glow)}
.intro-badge .ic{width:46px;height:46px}
.intro-title{font:900 clamp(44px,11vw,84px)/.88 var(--f-display);text-transform:uppercase}
.intro-sub{font-size:19px;color:var(--muted)}
.mission{width:100%}
.intro-meta{font:600 13px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* ---------- tarjetas de apuntes ---------- */
.note{margin-top:16px}
.note-title{font:800 clamp(30px,7vw,46px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin-bottom:18px}
.note-title:focus,.q:focus{outline:none}
.note-body{display:grid;gap:16px}
.note-body b{-webkit-box-decoration-break:clone;box-decoration-break:clone}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  .note-body p b,.note-body li b,.note-body blockquote b{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--a1) 34%,transparent) 0)}
}
.lead{font-size:18px;max-width:40em}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pts li{position:relative;padding-left:24px;max-width:62ch}
.pts li::before{content:"";position:absolute;left:3px;top:.52em;width:9px;height:9px;border-radius:2px;background:var(--a1);transform:rotate(45deg)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--panel2);border-radius:12px;padding:12px 10px;display:grid;gap:5px;align-content:start}
.fact b{font:800 clamp(22px,5.6vw,34px)/1 var(--f-display);color:var(--a1);overflow-wrap:anywhere;background:none!important}
.fact span{font:600 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow span{background:var(--panel2);border:1.5px solid var(--a1);border-radius:999px;padding:8px 14px;font-weight:700}
.flow i{font-style:normal;color:var(--a1);font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.duo{grid-template-columns:1fr}}
.duo-col{background:var(--panel2);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.duo-col ul{margin:0;padding-left:18px;display:grid;gap:8px}
.duo-col.good{box-shadow:inset 0 0 0 1.5px rgba(74,222,128,.4)}
.duo-col.bad{box-shadow:inset 0 0 0 1.5px rgba(255,93,93,.4)}
.duo-col.good > .eyebrow{color:var(--ok)}
.duo-col.bad > .eyebrow{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.tiles.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--panel2);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start}
.tile > b{font-size:17px;line-height:1.25}
.tile p{font-size:15.5px;line-height:1.45}
.tile-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--a1)}
.tile-ico .ic{width:20px;height:20px}
.tile.wide{grid-column:1/-1}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.step{background:var(--panel2);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start;position:relative}
.step > b{font:800 23px/1 var(--f-display);text-transform:uppercase;color:var(--a1);background:none!important}
.step p{font-size:15.5px}
.step em{font:600 12px/1.3 var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--a2)}
.step:not(:last-child)::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--a1);font-weight:700;font-size:20px}
@media (max-width:600px){.steps{grid-template-columns:1fr}.step:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-25px;transform:translateX(-50%)}}
.callout{background:var(--panel2);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.callout.rule{box-shadow:inset 0 0 0 1.5px var(--a1)}
.callout.rule .eyebrow{color:var(--a1)}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hub-core{background:var(--a1);color:var(--on);border-radius:14px;padding:14px;display:grid;align-content:center;gap:4px}
.hub-core .eyebrow{color:var(--on);opacity:.75}
.hub-core b{font:900 clamp(24px,4.4vw,30px)/1 var(--f-display);text-transform:uppercase;background:none!important;overflow-wrap:anywhere}
.hub .tile p{font-size:15px}
@media (max-width:600px){.hub{grid-template-columns:repeat(2,minmax(0,1fr))}.hub-core,.hub .tile:last-child{grid-column:1/-1}}
.leaps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.leaps li{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px}
.leaps li.leaps-h{background:none;padding-block:0}
.leap-n{font:900 30px/1 var(--f-display);color:var(--a1);background:none!important}
.leap-m{font-weight:700}
.leap-c::before{content:"→ ";color:var(--a1);font-weight:700}
@media (max-width:520px){.leaps li{grid-template-columns:40px minmax(0,1fr)}.leap-c{grid-column:2}.leaps li.leaps-h{display:none}}
.quote{margin:0;padding:18px 18px 16px;border-radius:14px;background:var(--panel2);font:700 clamp(18px,4vw,21px)/1.4 var(--f-body);position:relative}
.quote::before{content:"“";position:absolute;top:-14px;left:12px;font:900 58px/1 var(--f-display);color:var(--a1)}
.quote.big{font-size:clamp(20px,4.6vw,26px);padding-top:24px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.eq span{background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700}
.eq i{font:800 24px/1 var(--f-display);font-style:normal;color:var(--a1)}
.eq span.eq-res{background:var(--a1);color:var(--on);border-color:var(--a1);font:900 22px/1 var(--f-display);padding:9px 14px}
.loop{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);grid-template-rows:auto 36px auto}
.loop-node{background:var(--panel2);border-radius:14px;padding:14px;display:grid;gap:5px;align-content:start;border:1.5px solid var(--line)}
.loop-node b{font:800 23px/1 var(--f-display);text-transform:uppercase;color:var(--a1);background:none!important}
.loop-node p{font-size:15px}
.loop-k{font:600 12px/1 var(--f-mono);color:var(--muted)}
.loop-node.n1{border-color:var(--a1)}
.loop-node.n4{border-color:var(--a2)}
.loop-node.n4 b{color:var(--a2)}
.loop-arrow{display:grid;place-items:center;color:var(--a1);font:700 22px/1 var(--f-body)}
.loop-center{display:grid;place-items:center;color:var(--muted)}
.loop-center .ic{width:22px;height:22px;animation:spin 6s linear infinite}
.chipset{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chipset li{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:15px;font-weight:700}
.chipset.warn li{border:1.5px solid var(--a2);color:var(--a2);font:800 22px/1 var(--f-display);text-transform:uppercase;padding:10px 16px;background:transparent}
.twin{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.twin-box{border:2px solid var(--a1);border-radius:12px;padding:14px 18px;font:800 22px/1 var(--f-display);text-transform:uppercase}
.twin-box.ghost{border-style:dashed;color:var(--a1);background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(47,214,242,.12) 7px 9px)}
.twin-sync{font:600 12px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.itot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.itot-col{border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start;background:var(--panel2)}
.itot-col.it{box-shadow:inset 0 0 0 2px var(--a1)}
.itot-col.ot{box-shadow:inset 0 0 0 2px var(--a2)}
.itot-tag{font:900 34px/1 var(--f-display)}
.itot-col.it .itot-tag{color:var(--a1)}
.itot-col.ot .itot-tag{color:var(--a2)}
.itot-col ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.itot-merge{grid-column:1/-1;border-radius:14px;padding:14px 16px;background:var(--a3);color:var(--on);display:grid;gap:2px;text-align:center}
.itot-merge b{font:900 26px/1 var(--f-display);text-transform:uppercase;background:none!important}
@media (max-width:520px){.itot{grid-template-columns:1fr}}
.chain{list-style:none;margin:0 auto;padding:0;display:grid;gap:26px;max-width:420px;width:100%}
.chain li{position:relative;text-align:center;background:var(--panel2);border:1.5px solid var(--a1);border-radius:12px;padding:12px 14px;font-weight:700}
.chain li:not(:last-child)::after{content:"↓";position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);color:var(--a1);font-weight:700}
.chain li:last-child{background:var(--a1);color:var(--on)}
.iceberg{width:100%;max-width:470px;height:auto;display:block;margin:0 auto;color:var(--ink)}
.note-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{background:var(--a1);width:22px}

/* ---------- retos ---------- */
.ch{margin-top:16px}
.ch.shake{animation:shake .45s ease-in-out}
.streak-chip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--f-mono);color:var(--a1);text-transform:uppercase;letter-spacing:.08em}
.streak-chip .ic{color:#FF8A3D}
.q{font:700 clamp(21px,4.8vw,27px)/1.3 var(--f-body)}
.help{color:var(--muted);font-size:15px;margin-top:6px}
.case{background:var(--panel2);border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;gap:4px}
.case .eyebrow{color:var(--a1)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{appearance:none;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font:600 17px/1.35 var(--f-body);cursor:pointer;min-height:58px;transition:border-color .15s,background-color .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--a1)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt kbd{min-width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;background:var(--bg);color:var(--a1);border:1px solid var(--line);flex:none}
.opt:disabled{cursor:default}
.opt:disabled:not(.is-ok):not(.is-bad){opacity:.5}
.opt.is-ok{border-color:var(--ok);background:rgba(74,222,128,.14)}
.opt.is-ok kbd{background:var(--ok);color:#06210F;border-color:var(--ok)}
.opt.is-bad{border-color:var(--bad);background:rgba(255,93,93,.14)}
.opt.is-bad kbd{background:var(--bad);color:#2A0606;border-color:var(--bad)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tf .opt{justify-content:center;font-size:19px;min-height:74px;flex-direction:column;gap:8px}
.hint{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--gold);animation:fbIn .25s ease-out}
.hint .ic{width:26px;height:26px;color:var(--gold)}
.hint .eyebrow{display:block;color:var(--gold)}
.fb{margin-top:18px;border-radius:14px;padding:16px 18px;border:1.5px solid;display:grid;gap:10px;justify-items:start;animation:fbIn .25s ease-out}
.fb.ok{border-color:var(--ok);background:rgba(74,222,128,.09)}
.fb.bad{border-color:var(--bad);background:rgba(255,93,93,.09)}
.fb-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;width:100%}
.fb-title{font:900 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.fb.ok .fb-title{color:var(--ok)}
.fb.bad .fb-title{color:var(--bad)}
.fb-pts{font:600 13px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.fb-right{display:flex;gap:8px;align-items:flex-start}
.fb-right .ic{color:var(--ok);margin-top:3px}
.fb-ex .eyebrow{display:block;margin-bottom:2px}
/* ordenar */
.slots{display:grid;gap:8px;margin-top:16px}
.slot{appearance:none;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);text-align:left;font:600 16px/1.3 var(--f-body)}
.slot.filled{border-style:solid;border-color:var(--a1);background:var(--panel2);color:var(--ink);cursor:pointer}
.slot-n{font:800 22px/1 var(--f-display);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--bg);color:var(--a1);flex:none}
.slot.ok{border-color:var(--ok)}
.slot.ok .slot-n{background:var(--ok);color:#06210F}
.slot.bad{border-color:var(--bad)}
.slot.bad .slot-n{background:var(--bad);color:#2A0606}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{appearance:none;border:1.5px solid var(--a1);background:var(--panel2);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:46px;font:600 16px/1.25 var(--f-body);cursor:pointer;text-align:left}
.chip:hover:not(:disabled){background:var(--bg)}
.chip:disabled{opacity:.25;cursor:default;border-color:var(--line)}
.order-btns{margin-top:14px}
/* clasificar: cinta transportadora */
.belt{position:relative;margin-top:16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);min-height:176px;padding:38px 16px 36px;display:grid;place-items:center;overflow:hidden}
.belt-count{position:absolute;top:12px;left:14px}
.belt-item{position:relative;z-index:1;max-width:30em;background:var(--bg);border:2px solid var(--a1);border-radius:14px;padding:14px 18px;font:700 clamp(17px,4.2vw,20px)/1.35 var(--f-body);text-align:center;box-shadow:0 10px 0 -2px rgba(0,0,0,.35)}
.belt-item.in{animation:beltIn .38s cubic-bezier(.2,.8,.2,1)}
.belt-track{position:absolute;left:0;right:0;bottom:0;height:16px;border-top:2px solid var(--line);background:repeating-linear-gradient(90deg,var(--line) 0 12px,transparent 12px 24px);animation:belt .9s linear infinite}
.bins{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;margin-top:12px}
.bin{appearance:none;border:2px solid var(--bin);background:transparent;color:var(--ink);border-radius:14px;min-height:80px;padding:12px 8px;display:grid;place-items:center;align-content:center;gap:5px;cursor:pointer;transition:background-color .15s,transform .08s}
.bin strong{font:800 clamp(20px,5vw,27px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--bin)}
.bin small{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.bin:hover:not(:disabled){background:rgba(255,255,255,.05)}
.bin:active:not(:disabled){transform:translateY(1px)}
.bin:disabled{opacity:.5;cursor:default}
.bin.flash-ok{background:rgba(74,222,128,.2);border-color:var(--ok)}
.bin.flash-bad{background:rgba(255,93,93,.2);border-color:var(--bad)}
@media (max-width:480px){.bins.n3{grid-template-columns:1fr}.bins.n3 .bin{min-height:56px;grid-auto-flow:column;justify-content:space-between;padding:10px 16px}}
.belt-log{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.log{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.4;padding:8px 10px;border-radius:10px;background:var(--panel2);animation:fbIn .25s ease-out}
.log .ic{margin-top:2px}
.log.ok .ic{color:var(--ok)}
.log.bad{box-shadow:inset 0 0 0 1.5px var(--bad)}
.log.bad .ic{color:var(--bad)}
/* relacionar */
.match{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:10px;margin-top:16px;align-items:start}
.mcol{display:grid;gap:8px}
.mitem{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font:600 15px/1.3 var(--f-body);text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s}
.ml{font-weight:700}
.mitem:hover:not(:disabled){border-color:var(--a1)}
.mitem.sel{border-color:var(--a1);background:var(--bg);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.mitem.done{border-color:var(--ok);background:rgba(74,222,128,.08);cursor:default}
.mitem.wrong{border-color:var(--bad);animation:shake .45s}
.mnum{display:none;flex:none;width:24px;height:24px;border-radius:7px;background:var(--ok);color:#06210F;font:700 13px/24px var(--f-mono);text-align:center}
.mitem.done .mnum{display:inline-block}

/* ---------- fin de época ---------- */
.done-card{display:grid;gap:16px;justify-items:center;text-align:center;margin-top:16px;padding-block:30px}
.big-stars{display:flex;gap:10px}
.bstar{color:var(--line)}
.bstar .ic{width:56px;height:56px}
.bstar.on{color:var(--gold);animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.bonus{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--ok);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;width:100%}
.stats div{background:var(--panel2);border-radius:12px;padding:12px 10px;text-align:center}
.stats dt{font:600 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stats dd{margin:6px 0 0;font:800 clamp(24px,6vw,32px)/1 var(--f-display);font-variant-numeric:tabular-nums}
@media (max-width:520px){.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- jefe final ---------- */
.boss-wrap{display:grid;gap:12px;padding-block:14px 56px}
.boss-stage{display:grid;place-items:center;padding-top:14px}
.boss-svg{width:118px;height:auto;flex:none;overflow:visible}
.boss-svg.big{width:min(260px,64vw)}
.boss-svg .boss-body{transform-box:fill-box;transform-origin:center;animation:bossBob 3s ease-in-out infinite,glitch 5s steps(1) infinite}
.boss-svg .boss-orbit rect{transform-box:fill-box;transform-origin:center;animation:orbit 3.4s ease-in-out infinite alternate}
.boss-svg .boss-orbit rect:nth-child(2){animation-delay:-1.2s}
.boss-svg .boss-orbit rect:nth-child(3){animation-delay:-2.1s}
.boss-svg .boss-orbit rect:nth-child(4){animation-delay:-.6s}
.boss-svg .boss-badge{transform-box:fill-box;transform-origin:center;animation:badge 1.1s ease-in-out infinite}
.boss-svg .boss-x{opacity:0}
.boss-svg.hurt .boss-body{animation:hurt .55s ease-out}
.boss-svg.hurt .boss-eyes,.boss-svg.dead .boss-eyes{opacity:0}
.boss-svg.hurt .boss-x,.boss-svg.dead .boss-x{opacity:1}
.boss-svg.laugh .boss-body{animation:laugh .45s ease-in-out 2}
.boss-svg.dead{animation:die 1.8s ease-in .4s forwards}
.boss-top{display:flex;align-items:center;gap:14px}
.boss-hp{flex:1;display:grid;gap:6px;min-width:0}
.hp-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hp-num{font:800 24px/1 var(--f-display);color:var(--a1);font-variant-numeric:tabular-nums}
.hpbar{height:16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.speech{position:relative;background:var(--panel2);border:1.5px solid var(--a1);border-radius:14px;padding:12px 16px;font:700 16px/1.4 var(--f-body)}
.speech::before{content:"";position:absolute;left:44px;top:-8px;width:14px;height:14px;background:var(--panel2);border-left:1.5px solid var(--a1);border-top:1.5px solid var(--a1);transform:rotate(45deg)}
.boss-stage + .speech::before{left:calc(50% - 7px)}
.speech.pop{animation:fbIn .3s ease-out}
.boss-rules{margin:12px 0 18px;padding-left:20px;display:grid;gap:6px}
.timer-row{display:flex;align-items:center;gap:10px;margin-top:18px}
.timer{flex:1;height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--a2);transform-origin:left center}
.timer.low i{background:var(--bad)}
.timer-num{font:800 22px/1 var(--f-display);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- final y diploma ---------- */
.final{display:grid;gap:16px;padding-block:20px 56px}
.diploma{text-align:center;display:grid;gap:14px;justify-items:center;padding:34px 22px;border:2px solid var(--a1);position:relative}
.diploma::after{content:"";position:absolute;inset:8px;border:1px dashed var(--line);border-radius:12px;pointer-events:none}
.dip-title{font:900 clamp(40px,10vw,72px)/.9 var(--f-display);text-transform:uppercase}
.dip-name{font:900 clamp(34px,8vw,58px)/1 var(--f-display);text-transform:uppercase;color:var(--a1);overflow-wrap:anywhere}
.dip-eras{display:flex;gap:6px;justify-content:center}
.dip-eras i{width:26px;height:6px;border-radius:3px}
.rank{display:grid;gap:4px;justify-items:center}
.rank strong{font:900 clamp(40px,11vw,78px)/.9 var(--f-display);text-transform:uppercase;background:linear-gradient(90deg,#E7A93E,#FFD447,#48E5A4,#2FD6F2,#5AB0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.rank p{max-width:30em}
.over{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:30px}
.over-ico{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--heart)}
.over-ico .ic{width:46px;height:46px}
.review{display:grid;gap:12px}
.rv{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rv li{background:var(--panel2);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.rv-q{font-weight:700;font-size:17px}
.rv-a{display:flex;gap:8px;align-items:flex-start;font-size:15.5px}
.rv-a .ic{margin-top:3px}
.rv-a.bad .ic{color:var(--bad)}
.rv-a.ok .ic{color:var(--ok)}
.rv-ex{color:var(--muted);font-size:15px}

/* ---------- capas: salto temporal, modal, destellos ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center;overflow:hidden;animation:fadeIn .25s ease-out}
.overlay.out{animation:fadeOut .38s ease-in forwards}
.warp{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(255,255,255,.06) 58px 60px);animation:warp .35s linear infinite}
.warp::after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,var(--glow),transparent)}
.jump{position:relative;display:grid;gap:12px;justify-items:center}
.jump-year{font:900 clamp(110px,32vw,260px)/.82 var(--f-display);color:var(--a1);font-variant-numeric:tabular-nums;text-transform:uppercase;text-shadow:0 0 50px var(--glow)}
.jump-sub{font:700 clamp(16px,4vw,21px)/1.35 var(--f-body);max-width:26em}
.jump.glitch .jump-year{animation:glitchText .8s steps(2) infinite}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(5,5,10,.7)}
.modal-box{width:min(780px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.85)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.menu-list{display:grid;gap:10px}
.menu-list .btn{justify-content:flex-start}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 14px;font:700 14px/1 var(--f-body);cursor:pointer}
.tab.on{background:var(--st);border-color:var(--st);color:var(--on)}
.notes-stack{display:grid;gap:12px}
.note-mini{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.note-mini h3{font:800 28px/1 var(--f-display);text-transform:uppercase}
.flash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(255,50,70,.4))}
.flash.go{animation:flash .45s ease-out forwards}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);z-index:55;transform:translateX(-50%);background:var(--a1);color:var(--on);font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:12px 20px;border-radius:14px;box-shadow:0 12px 40px -10px var(--a1);pointer-events:none;white-space:nowrap;display:flex;gap:8px;align-items:center}
.toast.go{animation:toast 1.2s ease-out forwards}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:460px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl thead th{font:600 12px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tbl tbody th{color:var(--a1);white-space:nowrap}
.graded{display:grid;gap:8px;border:2px solid var(--gold);background:rgba(255,212,71,.08);border-radius:16px;padding:16px 18px}
.graded strong{font:900 26px/1 var(--f-display);text-transform:uppercase;color:var(--gold);letter-spacing:.02em}
.graded ul{margin:0;padding-left:20px;display:grid;gap:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field input,.field select{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;font-size:17px}
.field input:focus,.field select:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px rgba(255,181,71,.25)}
.field.bad input,.field.bad select{border-color:var(--bad)}
.howto{margin:0;padding-left:22px;display:grid;gap:8px}
.warn-line{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.warn-line .ic{color:var(--bad);margin-top:3px}
.agree{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;line-height:1.45}
.agree input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--a1)}
.agree.bad{border-color:var(--bad)}
.form-err{color:var(--bad);font-weight:700}
.nota{display:grid;gap:2px;justify-items:center}
.nota strong{font:900 clamp(64px,18vw,120px)/.9 var(--f-display);color:var(--a1);font-variant-numeric:tabular-nums}
.send{width:100%;display:grid;gap:10px;justify-items:center;text-align:center;border-radius:14px;padding:16px;border:1.5px solid var(--line);background:var(--panel2)}
.send.ok{border-color:var(--ok)}
.send.err{border-color:var(--bad)}
.send.wait{border-color:var(--gold)}
.send b.st{font:800 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.send.ok b.st{color:var(--ok)}.send.err b.st{color:var(--bad)}.send.wait b.st{color:var(--gold)}
.pending{border:2px solid var(--bad);border-radius:16px;padding:16px;display:grid;gap:10px;background:rgba(255,93,93,.08)}
@media (max-width:480px){.bins.n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:1px solid var(--line);border-radius:14px}

/* ---------- animaciones ---------- */
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes heartBreak{0%{transform:scale(1);color:var(--heart)}35%{transform:scale(1.6) rotate(-14deg);color:var(--heart)}100%{transform:none}}
@keyframes heartGain{0%{transform:scale(.2)}60%{transform:scale(1.6)}100%{transform:none}}
@keyframes starPop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes warp{to{background-position:60px 0}}
@keyframes belt{to{background-position:24px 0}}
@keyframes beltIn{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bossBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbit{from{transform:translate(0,0) rotate(0)}to{transform:translate(4px,-10px) rotate(16deg)}}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes glitch{0%,90%,100%{filter:none;translate:0 0}91%{filter:drop-shadow(-3px 0 var(--a3)) drop-shadow(3px 0 var(--a2));translate:3px 0}93%{filter:drop-shadow(3px 0 var(--a3));translate:-3px 1px}95%{filter:none;translate:0 0}}
@keyframes glitchText{0%{text-shadow:-4px 0 var(--a3),4px 0 var(--a2);translate:0 0}50%{text-shadow:4px 0 var(--a3),-4px 0 var(--a2);translate:2px -1px}}
@keyframes hurt{0%{transform:none;filter:brightness(3)}25%{transform:translateX(-10px)}50%{transform:translateX(8px);filter:brightness(1.6)}75%{transform:translateX(-4px)}100%{transform:none;filter:none}}
@keyframes laugh{0%,100%{transform:none}50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes die{0%{transform:none;opacity:1;filter:none}35%{transform:rotate(-8deg) scale(1.06);filter:brightness(2.2)}100%{transform:rotate(18deg) scale(.35) translateY(70px);opacity:0;filter:grayscale(1)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="screen"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="flash" class="flash" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

    notes(b) { openNotes(b.dataset.w != null ? +b.dataset.w : null); },
    'notes-tab'(b) { openNotes(+b.dataset.w); },
    quit(b) {
      if (b.dataset.armed) return abandon();
      b.dataset.armed = '1';
      b.innerHTML = icon('cross') + ' Pulsa otra vez para abandonar (se pierde la partida)';
    },
    'go-map'() { goMap(); },
    'boss-start'() { bossQuestion(); },
    victory() { victory(); }
  };
  const GUARDED = { opt: 1, tf: 1, slot: 1, unslot: 1, bin: 1, ml: 1, mr: 1, 'order-check': 1, 'order-reset': 1, next: 1 };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (GUARDED[act] && ui && performance.now() < (ui.readyAt || 0)) return;
    const fn = ACT[act];
    if (fn) fn(b, e);
  });
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e) => {
    const m = $('#modal');
    if (!m.hidden) { if (e.key === 'Escape') { e.preventDefault(); closeModal(); } return; }
    if (!$('#overlay').hidden) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select') { if (e.key === 'Enter') { e.preventDefault(); const b = $('#btn-main'); if (b) b.click(); } return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { if (run) { e.preventDefault(); openMenu(); } return; }
    const k = (e.key || '').toLowerCase();
    const playing = pos && (pos.screen === 'challenge' || pos.screen === 'boss') && ui && ui.c && !ui.done;
    if (playing) {
      if (performance.now() < (ui.readyAt || 0)) return;
      if (ui.c.t === 'quiz') {
        const idx = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[k];
        if (idx != null && ui.opts && idx < ui.opts.length) { e.preventDefault(); pickOpt(idx); return; }
      } else if (ui.c.t === 'tf') {
        if (k === 'v' || k === '1') { e.preventDefault(); pickTF(true); return; }
        if (k === 'f' || k === '2') { e.preventDefault(); pickTF(false); return; }
      }
      if (k === 'p') { e.preventDefault(); useHint(); return; }
    }
    if (pos && pos.screen === 'cards') {
      if (e.key === 'ArrowRight') { e.preventDefault(); ACT['card-next'](); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); ACT['card-prev'](); }
    }
  });

  /* ---------- arranque ---------- */
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ run, pos })); } catch (e) { /* sin recarga en caliente */ }
  function testSend() {
    setEra(0);
    const now = new Date();
    const res = { nombre: 'PRUEBA', apellidos: 'ENVÍO', ciclo: CICLOS[0], nota: 0, notaTxt: '0,0', aciertos: 0, retos: 0, puntos: 0, estrellas: '0/' + MAX_STARS, mejorRacha: 0, vidas: '0/' + MAX_LIVES, tiempo: '0:00', intento: 0, nivel: 'Prueba de envío', fecha: now.toISOString(), fechaTxt: now.toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' }), fallos: [] };
    render('<main class="wrap final"><section class="panel over"><span class="eyebrow">Solo para el profesor</span><h1 class="intro-title">Prueba de envío</h1><p>Se envía un PDF de ejemplo a nombre de «PRUEBA ENVÍO» con nota 0. Compruébalo en la carpeta de Drive y bórralo después.</p><div class="send wait" id="send-box" aria-live="polite"><b class="st">Preparando…</b></div><button type="button" class="btn ghost" data-act="title">Ir al juego</button></section></main>');
    sendResult(res);
  }
  function boot(data) {
    if (location.hash === '#prueba-envio') { store.del(KEY.pending); testSend(); setTimeout(() => store.del(KEY.pending), 8000); return; }
    if (data && data.run) { run = data.run; pos = data.pos || { screen: 'map' }; lastBeat = Date.now(); resume(); }
    else showTitle();
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
