function win() {
  S.phase = 'win'; S.t1 = Date.now(); S.lifeBonus = S.lives * 300; S.score += S.lifeBonus;
  unlock('turing'); if (S.lives === 1) unlock('edge'); if (!S.usedHint) unlock('nohint');
  save(); view = 'win'; U = {}; render(); window.scrollTo(0, 0);
  SND.play('win'); FX.confetti(160); if (!RM) setTimeout(() => FX.confetti(110), 1100);
}
function gameOver() {
  S.phase = 'over'; S.t1 = Date.now(); save();
  closeOverlay(true); view = 'over'; U = {}; render(); window.scrollTo(0, 0); SND.play('over');
}

/* ----- Pantallas finales ----- */
function rankFor(st) { return st >= 27 ? 'Leyenda de Turing' : st >= 22 ? 'Mente maestra de la IA' : st >= 16 ? 'Promesa del deep learning' : 'Aprendiz de datos'; }
function endHTML(won) {
  const st = totalStars(); const acc = S.total ? Math.round(S.ok / S.total * 100) : 0;
  const mins = Math.max(1, Math.round(((S.t1 || Date.now()) - S.t0) / 60000));
  const done = Math.min(S.mod, MODS.length);
  const serial = 'TUR-' + (S.t0 % 2176782336).toString(36).toUpperCase().padStart(6, '0');
  const date = new Date(S.t1 || Date.now()).toLocaleDateString('es-ES', {day: '2-digit', month: '2-digit', year: 'numeric'});
  const starsGrid = MODS.map((m, i) => `<div class="sr-item"><span class="sr-ref">${m.ref}</span>${starRow(S.stars[i] || 0)}</div>`).join('');
  const ach = Object.keys(ACH).map(k => `<li class="ach${S.ach.indexOf(k) >= 0 ? ' on' : ''}">${ICON.trophy}<div><strong>${ACH[k].t}</strong><span>${ACH[k].d}</span></div></li>`).join('');
  const review = S.log.length
    ? `<section class="end-block review"><h2>Para repasar (${S.log.length})</h2><ol>${S.log.map(e => `<li><span class="ref-badge sm">${esc(e.ref)}</span><p class="rv-q">${esc(e.q)}</p><p class="rv-a">Solución: ${esc(e.a)}</p><p class="rv-e">${md(e.exp)}</p></li>`).join('')}</ol></section>`
    : '<section class="end-block"><h2>Para repasar</h2><p class="empty">No has fallado ningún reto. Impecable.</p></section>';
  const stats = `<dl class="stat-grid">
      <div class="stat"><dt>Puntuación</dt><dd>${fmt(S.score)}</dd></div>
      <div class="stat"><dt>Estrellas</dt><dd>${st}/30</dd></div>
      <div class="stat"><dt>Vidas</dt><dd>${S.lives}/5</dd></div>
      <div class="stat"><dt>Precisión</dt><dd>${acc} %</dd></div>
      <div class="stat"><dt>Mejor racha</dt><dd>${S.best}</dd></div>
      <div class="stat"><dt>Tiempo</dt><dd>${mins} min</dd></div>
    </dl>`;
  const actions = `<div class="end-actions"><button class="btn btn-primary" data-act="again">${won ? 'Jugar otra vez' : 'Reintentar la misión'} ${ICON.arrow}</button><button class="btn btn-ghost" data-act="notes">${ICON.book} Repasar apuntes</button></div>`;
  if (won) {
    return `<main class="wrap wrap--wide screen screen--end">
      <div class="end-hero">${turi('happy', 118)}<div><p class="eyebrow">Misión cumplida</p><h1 class="end-title" tabindex="-1">¡TURI ha superado el Test de Turing!</h1>
        <p class="lead">El juez no ha sabido distinguir a TURI de un ser humano. Todo gracias a tu entrenamiento${S.lifeBonus ? ` (+${fmt(S.lifeBonus)} puntos por las vidas que te quedaban)` : ''}.</p></div></div>
      <section class="cert" aria-label="Certificado de entrenamiento">
        <div class="cert-top"><span>Certificado de entrenamiento</span><span>Nº ${serial}</span></div>
        <p class="cert-name">${esc(P.name || 'Operador/a')}</p>
        <p class="cert-desc">ha entrenado a TURI con los apuntes de la <strong>UT4 · Aplicación de la inteligencia artificial</strong> y ha superado el Test de Turing.</p>
        <p class="cert-rank"><span>Rango</span>${rankFor(st)}</p>
        ${stats}
        <div class="cert-foot"><span>${date}</span><span>Haz una captura para enseñársela a tu profe</span></div>
      </section>
      <section class="end-block"><h2>Estrellas por módulo</h2><div class="star-grid">${starsGrid}</div></section>
      <section class="end-block"><h2>Logros</h2><ul class="ach-list">${ach}</ul></section>
      ${review}${actions}
    </main>`;
  }
  const where = S.mod < MODS.length ? `${MODS[S.mod].ref} · ${esc(MODS[S.mod].title)}` : 'el Test de Turing';
  return `<main class="wrap wrap--wide screen screen--end">
    <div class="end-hero">${turi('off', 118)}<div><p class="eyebrow">Sin energía</p><h1 class="end-title" tabindex="-1">TURI se ha apagado</h1>
      <p class="lead">Te has quedado sin vidas en <strong>${where}</strong>. Has completado <strong>${done} de 10 módulos</strong>. Repasa los fallos de abajo y vuelve a intentarlo: esta vez lo sabes mejor.</p></div></div>
    <section class="end-block">${stats}</section>
    <section class="end-block"><h2>Estrellas por módulo</h2><div class="star-grid">${starsGrid}</div></section>
    ${review}${actions}
  </main>`;
}

/* ============ Capas: menú, apuntes, confirmaciones ============ */
function openModal(html, closeAct) {
  pauseBoss();
  if (!$('#layer').firstChild) lastFocus = document.activeElement;
  $('#layer').innerHTML = `<div class="overlay" data-close="${closeAct || 'close-ov'}">${html}</div>`;
  const f = $('#layer .panel [data-act]:not(:disabled), #layer .panel button:not(:disabled)');
  if (f) f.focus({preventScroll: true});
}
function closeOverlay(silent) {
  const had = !!$('#layer').firstChild;
  $('#layer').innerHTML = '';
  if (!silent) resumeBoss();
  if (had && lastFocus && document.body.contains(lastFocus)) { try { lastFocus.focus({preventScroll: true}); } catch (e) { /* nada */ } }
  lastFocus = null;
}
function openMenu() {
  const inQ = view === 'play' || view === 'boss';
  openModal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="menuT">
    <p class="eyebrow">Menú</p><h2 id="menuT">Pausa</h2>
    <div class="menu-list">
      <button class="btn btn-primary" data-act="close-ov">Seguir jugando</button>
      ${view === 'intro' ? '<button class="btn btn-ghost" data-act="to-map">Volver al mapa</button>' : ''}
      ${inQ ? '' : `<button class="btn btn-ghost" data-act="notes">${ICON.book} Apuntes</button>`}
      <button class="btn btn-ghost" data-act="sound">${P.sound ? ICON.soundOn : ICON.soundOff} Sonido: ${P.sound ? 'activado' : 'desactivado'}</button>
      <button class="btn btn-ghost" data-act="howto">Cómo se juega</button>
      <button class="btn btn-danger" data-act="ask-restart">Reiniciar la misión</button>
      <button class="link" data-act="home">Ir a la portada</button>
    </div>
    ${inQ ? '<p class="help">Durante un reto, los apuntes se quedan cerrados. Usa las pistas si te atascas.</p>' : ''}
  </div>`);
}
function notesAvail(i) { return P.notes.indexOf(i) >= 0 && !(running() && i === S.mod && S.ch > 0); }
function openNotes(sel) {
  let cur = sel;
  if (cur == null || P.notes.indexOf(cur) < 0) { const list = P.notes.filter(notesAvail); cur = list.length ? Math.max.apply(null, list) : null; }
  const tabs = MODS.map((m, i) => `<button class="ntab${i === cur ? ' on' : ''}" data-act="ntab" data-i="${i}"${P.notes.indexOf(i) >= 0 ? '' : ' disabled'} aria-pressed="${i === cur}">${m.ref}</button>`).join('');
  let body;
  if (cur == null) body = '<p class="empty">Todavía no has cargado ningún módulo. Empieza la misión y los apuntes irán apareciendo aquí.</p>';
  else if (!notesAvail(cur)) body = '<p class="empty">Estás en mitad de este módulo. Termina sus retos para volver a consultar estos apuntes.</p>';
  else { const m = MODS[cur]; body = `<div class="n-head"><span class="ref-badge sm">${m.ref}</span><div><h3>${esc(m.title)}</h3><p>${m.slides}</p></div></div>` + m.notes.map(c => noteHTML(c, 'h4')).join(''); }
  openModal(`<div class="panel panel--notes" role="dialog" aria-modal="true" aria-labelledby="nT">
    <div class="n-top"><h2 id="nT">${ICON.book} Apuntes de TURI</h2><button class="icon-btn" data-act="close-ov" aria-label="Cerrar apuntes">${ICON.x}</button></div>
    <nav class="ntabs" aria-label="Módulos">${tabs}</nav>
    <div class="n-body">${body}</div></div>`);
  const t = $(`#layer .ntab[data-i="${cur}"]`); if (t && sel != null) t.focus({preventScroll: true});
}
function askConfirm(title, text, yes, fn) {
  confirmFn = fn;
  openModal(`<div class="panel" role="alertdialog" aria-modal="true" aria-labelledby="cT"><h2 id="cT">${esc(title)}</h2><p>${esc(text)}</p>
    <div class="row"><button class="btn btn-ghost" data-act="close-ov">Cancelar</button><button class="btn btn-danger" data-act="confirm-yes">${esc(yes)}</button></div></div>`);
}

/* ============ Render y acciones ============ */
const app = $('#app');
function render() {
  if (U && U.tid) { clearInterval(U.tid); U.tid = 0; }
  let html = '';
  switch (view) {
    case 'map': html = mapHTML(); break;
    case 'intro': html = introHTML(); break;
    case 'play': html = playHTML(); break;
    case 'boss': html = bossHTML(); break;
    case 'win': html = endHTML(true); break;
    case 'over': html = endHTML(false); break;
    default: html = startHTML();
  }
  app.innerHTML = html;
  if (view === 'map') { drawBoard(); requestAnimationFrame(scrollToCurrent); }
  const h = app.querySelector('h1[tabindex="-1"]'); if (h && view !== 'start') h.focus({preventScroll: true});
}
function goMap() { view = 'map'; U = {}; closeSheet(); render(); }
function newGame() {
  S = newRun(); save(); closeOverlay(true); SND.play('power'); goMap(); window.scrollTo(0, 0);
}
function readName() { const inp = $('#opName'); const v = inp ? inp.value.trim().slice(0, 24) : ''; if (v) { P.name = v; savePrefs(); } return v; }

const ACT = {
  start() {
    const v = readName();
    if (!v) { const inp = $('#opName'); if (inp) { inp.focus(); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); } toast('Escribe tu nombre', 'Así aparecerá en tu certificado.', true); return; }
    newGame();
  },
  continue() { readName(); SND.play('power'); goMap(); window.scrollTo(0, 0); },
  'ask-new'() { askConfirm('¿Empezar una misión nueva?', 'Se perderá la partida guardada. Los apuntes que ya has desbloqueado se conservan.', 'Empezar de cero', () => { readName(); newGame(); }); },
  last() { if (S && (S.phase === 'over' || S.phase === 'win')) { view = S.phase; render(); window.scrollTo(0, 0); } },
  chip(b) {
    const i = +b.dataset.i;
    if (i < S.mod) { openNotes(i); return; }
    if (i > S.mod) { SND.play('buzz'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); toast('Chip bloqueado', 'Completa antes ' + (S.mod < MODS.length ? MODS[S.mod].ref + ' · ' + MODS[S.mod].title : 'los módulos') + '.', true); return; }
    if (i === MODS.length) { startBoss(); return; }
    if (P.notes.indexOf(i) < 0) { P.notes.push(i); savePrefs(); }
    SND.play('click');
    if (S.ch > 0) { startChallenges(); return; }
    view = 'intro'; U = {card: 0}; render(); window.scrollTo(0, 0);
  },
  'card-prev'() { U.card = Math.max(0, (U.card || 0) - 1); SND.play('click'); render(); },
  'card-next'() { U.card = Math.min(MODS[S.mod].notes.length - 1, (U.card || 0) + 1); SND.play('click'); render(); },
  begin() { SND.play('click'); startChallenges(); },
  'to-map'() { closeOverlay(true); goMap(); window.scrollTo(0, 0); },
  opt(b) { if (U.done) return; U.q.sel = +b.dataset.i; SND.play('select'); renderQ(); },
  tf(b) { if (U.done) return; U.q.sel = b.dataset.v === '1'; SND.play('select'); renderQ(); },
  pick(b) {
    if (U.done) return; const u = U.q, q = activeQ(); const i = +b.dataset.i;
    if (u.locked === i) return;
    if (u.sel.has(i)) u.sel.delete(i);
    else {
      if (u.sel.size >= q.a.length) { const cl = $('#qbody .count-line'); if (cl) { cl.classList.remove('nudge'); void cl.offsetWidth; cl.classList.add('nudge'); } SND.play('buzz'); return; }
      u.sel.add(i);
    }
    SND.play('select'); renderQ();
  },
  bin(b) { sortPick(+b.dataset.b); },
  'ord-add'(b) { if (U.done) return; const u = U.q, q = activeQ(); const i = +b.dataset.i; if (u.placed.indexOf(i) >= 0 || u.placed.length >= q.items.length) return; u.placed.push(i); SND.play('select'); renderQ(); },
  'ord-rm'(b) { if (U.done) return; const u = U.q; const k = +b.dataset.k; if (k < u.lock || u.placed[k] == null) return; u.placed.splice(k, 1); SND.play('click'); renderQ(); },
  'm-left'(b) { if (U.done) return; const u = U.q; const i = +b.dataset.i; if (i === u.lockL) return; if (u.selL === i) { delete u.pairs[i]; u.selL = null; } else u.selL = i; SND.play('select'); renderQ(); },
  'm-right'(b) {
    if (U.done) return; const u = U.q, q = activeQ(); const j = +b.dataset.i;
    let owner = -1; Object.keys(u.pairs).forEach(l => { if (u.pairs[l] === j) owner = +l; });
    if (u.selL == null) { if (owner >= 0 && owner !== u.lockL) { delete u.pairs[owner]; u.selL = owner; SND.play('click'); renderQ(); } return; }
    if (owner >= 0 && owner === u.lockL) return;
    if (owner >= 0) delete u.pairs[owner];
    u.pairs[u.selL] = j;
    const nx = range(q.pairs.length).find(k => u.pairs[k] == null);
    u.selL = nx == null ? null : nx;
    SND.play('select'); renderQ();
  },
  'fill-tok'(b) {
    if (U.done) return; const u = U.q; const id = +b.dataset.i;
    const g = (u.active != null && u.active >= 0 && u.slots[u.active] == null) ? u.active : u.slots.findIndex(s => s == null);
    if (g < 0) return;
    u.slots[g] = id; u.active = u.slots.findIndex(s => s == null); SND.play('select'); renderQ();
  },
  'fill-gap'(b) { if (U.done) return; const u = U.q; const k = +b.dataset.k; if (k === u.lockGap) return; if (u.slots[k] != null) { u.slots[k] = null; SND.play('click'); } u.active = k; renderQ(); },
  check() { check(); },
  hint() { useHint(); },
  next() { next(); },
  menu() { SND.play('click'); openMenu(); },
  'close-ov'() { closeOverlay(); },
  notes() { openNotes(); },
  ntab(b) { openNotes(+b.dataset.i); },
  sound() {
    P.sound = !P.sound; savePrefs(); if (P.sound) SND.play('click');
    if ($('#layer').firstChild) openMenu(); else if (view === 'start') render();
  },
  howto() { openModal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="hT"><p class="eyebrow">Instrucciones</p><h2 id="hT">Cómo se juega</h2>
    <p>Cada módulo empieza cargando los apuntes: léelos con calma. Después llegan los retos: elegir respuesta, detectar alucinaciones, clasificar en la seleccionadora, ordenar la línea temporal, conectar parejas y completar frases.</p>
    ${datasheetHTML()}<button class="btn btn-primary btn-block" data-act="close-ov" style="margin-top:16px">Entendido</button></div>`); },
  'ask-restart'() { askConfirm('¿Reiniciar la misión?', 'Volverás al módulo U1 con 5 vidas y 0 puntos. Los apuntes desbloqueados se conservan.', 'Reiniciar', () => newGame()); },
  'confirm-yes'() { const f = confirmFn; confirmFn = null; closeOverlay(true); if (f) f(); },
  'close-done'() { closeOverlay(); U.hideTrace = null; U.animTrace = S.mod - 1; drawBoard(); setTimeout(scrollToCurrent, RM ? 0 : 700); },
  'boss-go'() { closeOverlay(true); bossStartTyping(); },
  again() { newGame(); },
  home() { closeOverlay(true); closeSheet(); view = 'start'; U = {}; render(); window.scrollTo(0, 0); }
};

document.addEventListener('click', e => {
  const ov = e.target.classList && e.target.classList.contains('overlay') ? e.target : null;
  if (ov) { const a = ov.dataset.close; if (ACT[a]) ACT[a](); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.getAttribute('aria-disabled') === 'true' && b.dataset.act !== 'chip') return;
  SND.ensure();
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('submit', e => { if (e.target && e.target.id === 'startForm') { e.preventDefault(); SND.ensure(); if (hasSaved()) ACT.continue(); else ACT.start(); } });
document.addEventListener('keydown', e => {
  if (e.target && e.target.matches && e.target.matches('input, textarea')) return;
  const layerOpen = !!$('#layer').firstChild; const sheetOpen = !$('#sheet').hidden;
  if (e.key === 'Escape') {
    if (layerOpen) { const ov = $('#layer .overlay'); const a = ov && ov.dataset.close; if (a && ACT[a]) ACT[a](); else closeOverlay(); }
    else if (S && (view === 'map' || view === 'intro' || view === 'play' || view === 'boss')) openMenu();
    return;
  }
  if (layerOpen || e.ctrlKey || e.metaKey || e.altKey) return;
  const onBody = !document.activeElement || document.activeElement === document.body || (document.activeElement.tagName === 'H1');
  if (e.key === 'Enter' && onBody) {
    const nb = $('#nextBtn'); const cb = $('#checkBtn');
    if (sheetOpen && nb) { e.preventDefault(); nb.click(); } else if (cb && !cb.disabled) { e.preventDefault(); cb.click(); }
    return;
  }
  if (sheetOpen || !(view === 'play' || view === 'boss') || U.done || U.typing) return;
  const n = parseInt(e.key, 10); if (isNaN(n) || n < 1) return;
  const q = activeQ(); const u = U.q; const k = n - 1; if (!q || !u) return;
  let target = null;
  if (q.type === 'mc' && k < u.order.length) target = `[data-act="opt"][data-i="${u.order[k]}"]`;
  else if (q.type === 'tf' && k < 2) target = `[data-act="tf"][data-v="${k === 0 ? 1 : 0}"]`;
  else if (q.type === 'pick' && k < u.order.length) target = `[data-act="pick"][data-i="${u.order[k]}"]`;
  else if (q.type === 'sort' && k < q.bins.length) target = `[data-act="bin"][data-b="${k}"]`;
  else if (q.type === 'order') { const pool = u.pool.filter(i => u.placed.indexOf(i) < 0); if (k < pool.length) target = `[data-act="ord-add"][data-i="${pool[k]}"]`; }
  else if (q.type === 'fill') { const bank = u.bank.filter(b => u.slots.indexOf(b.id) < 0); if (k < bank.length) target = `[data-act="fill-tok"][data-i="${bank[k].id}"]`; }
  if (target) { const el = $('#qbody ' + target); if (el && !el.disabled) { e.preventDefault(); el.click(); } }
});
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { FX.resize(); if (view === 'map') drawBoard(); }, 150); });

/* ============ Arranque ============ */
function boot(data) {
  FX.init();
  const saved = (data && data.S) || store.get(KEY + ':run');
  if (saved && saved.v === 1 && saved.boss && Array.isArray(saved.stars)) S = saved;
  view = 'start';
  if (data && data.view && S && running()) view = (data.view === 'intro' || data.view === 'play' || data.view === 'boss') ? 'map' : data.view;
  render();
}
try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({S: S, view: view})); } catch (e) { /* entorno sin recarga en caliente */ }
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
