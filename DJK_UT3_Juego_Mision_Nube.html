<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Nube</title>
<meta name="description" content="Juego para repasar la UT3 · Sistemas en la nube (Cloud): 5 niveles, un jefe final y 5 vidas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  --sky-top:#8FCBFF; --sky-bot:#EAF6FF;
  --ink:#12284F; --ink-2:#34507F; --muted:#5E7299;
  --surface:#FFFFFF; --surface-2:#F1F7FF; --line:#D3E2F4;
  --brand:#1F3B73; --brand-ink:#FFFFFF;
  --accent:#FFB23E; --accent-ink:#3A2400;
  --ok:#2A9A55; --ok-bg:#E1F5E8; --bad:#D9434C; --bad-bg:#FDE6E7;
  --heart:#EF4B5C; --heart-empty:#C9D6EA;
  --cloud:#FFFFFF; --cloud-shade:#D7E8FA;
  --c-cloud:#3E7BE0; --c-fog:#7C8BA8; --c-edge:#5E9A2A;
  --saas:#7B5CE0; --paas:#1E9C9C; --iaas:#E07A2E;
  --shadow:0 12px 32px rgba(18,40,79,.14);
  --shadow-sm:0 4px 12px rgba(18,40,79,.10);
  --r:18px;
  --f-display:"Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky-top:#050C22; --sky-bot:#17295B;
    --ink:#EAF1FF; --ink-2:#C0D2F4; --muted:#93A8D2;
    --surface:#13234B; --surface-2:#0F1C3F; --line:#2A4580;
    --brand:#9CC0FF; --brand-ink:#0A1733;
    --accent:#FFC857; --accent-ink:#2A1A00;
    --ok:#4CC27A; --ok-bg:#133A2A; --bad:#FF6F77; --bad-bg:#46161E;
    --heart:#FF5D6E; --heart-empty:#34497A;
    --cloud:#2B3F74; --cloud-shade:#1F3163;
    --c-cloud:#6FA2FF; --c-fog:#A3B1CC; --c-edge:#8CCB4E;
    --saas:#A88BFF; --paas:#3CC7C7; --iaas:#FF9C55;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    --shadow-sm:0 4px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky-top:#050C22; --sky-bot:#17295B;
  --ink:#EAF1FF; --ink-2:#C0D2F4; --muted:#93A8D2;
  --surface:#13234B; --surface-2:#0F1C3F; --line:#2A4580;
  --brand:#9CC0FF; --brand-ink:#0A1733;
  --accent:#FFC857; --accent-ink:#2A1A00;
  --ok:#4CC27A; --ok-bg:#133A2A; --bad:#FF6F77; --bad-bg:#46161E;
  --heart:#FF5D6E; --heart-empty:#34497A;
  --cloud:#2B3F74; --cloud-shade:#1F3163;
  --c-cloud:#6FA2FF; --c-fog:#A3B1CC; --c-edge:#8CCB4E;
  --saas:#A88BFF; --paas:#3CC7C7; --iaas:#FF9C55;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --shadow-sm:0 4px 12px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 70%) fixed;
  background-color:var(--sky-bot);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Sky decoration ---------- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .puff{position:absolute;opacity:.85;animation:drift linear infinite}
.sky .puff svg{display:block;width:100%;height:auto}
.sky .puff path{fill:var(--cloud)}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .6s;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent 61%),
  radial-gradient(1px 1px at 28% 42%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 44% 12%,#fff 60%,transparent 61%),
  radial-gradient(1px 1px at 62% 30%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 78% 16%,#fff 60%,transparent 61%),
  radial-gradient(1px 1px at 88% 48%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 8% 64%,#fff 60%,transparent 61%),
  radial-gradient(1.5px 1.5px at 36% 72%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 70% 66%,#fff 60%,transparent 61%),
  radial-gradient(1px 1px at 94% 80%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 52% 88%,#fff 60%,transparent 61%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stars{opacity:.8}}
:root[data-theme="dark"] .stars{opacity:.8}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- App shell ---------- */
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding-inline:16px;padding-block:12px 28px}
.screen{width:100%;max-width:760px;display:flex;flex-direction:column;gap:16px;animation:enter .35s ease both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;
  font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;
  padding:12px 22px;border-radius:14px;background:var(--brand);color:var(--brand-ink);
  box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s ease, box-shadow .08s ease, filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.big{font-size:22px;padding:15px 30px}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:15px;padding:7px 12px;gap:6px;box-shadow:0 3px 0 var(--line)}
.btn.small svg{width:18px;height:18px}
.tile small{color:var(--muted);font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.center{justify-content:center}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;width:100%;max-width:760px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.hearts{display:flex;gap:3px}
.heart{width:28px;height:28px}
.heart path{fill:var(--heart);transition:fill .3s}
.heart.off path{fill:var(--heart-empty)}
.heart.break{animation:hbreak .7s ease}
.heart.gain{animation:hgain .7s ease}
@keyframes hbreak{0%{transform:scale(1)}20%{transform:scale(1.35) rotate(-12deg)}45%{transform:scale(.8) rotate(10deg)}100%{transform:scale(1)}}
@keyframes hgain{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:18px;
  padding:3px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill .ico{width:18px;height:18px}
.pill.streak{color:#C45A00}
.pill.streak.hot{background:#FFE9C7;border-color:#FFC874}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.streak{color:var(--accent)} :root:not([data-theme="light"]) .pill.streak.hot{background:#4A3212;border-color:#8A5A12}}
:root[data-theme="dark"] .pill.streak{color:var(--accent)}
:root[data-theme="dark"] .pill.streak.hot{background:#4A3212;border-color:#8A5A12}
.hud .spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.iconbtn:hover{background:var(--surface-2)}
.score-pop{position:fixed;z-index:50;font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ok);
  pointer-events:none;animation:popup 1s ease forwards;text-shadow:0 2px 0 var(--surface)}
.score-pop.bad{color:var(--bad)}
@keyframes popup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}

/* ---------- Mascot ---------- */
.nubi{width:120px;height:auto;flex:none;filter:drop-shadow(0 8px 10px rgba(18,40,79,.18));animation:bob 3.2s ease-in-out infinite}
.nubi .body{fill:var(--cloud);stroke:var(--cloud-shade);stroke-width:3}
.nubi .eye{fill:var(--ink);transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
.nubi .cheek{fill:#FF9AA8;opacity:.55}
.nubi .mouth{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.nubi .m-sad,.nubi .m-o{display:none}
.nubi.sad .m-happy,.nubi.think .m-happy{display:none}
.nubi.sad .m-sad{display:block}
.nubi.think .m-o{display:block}
.nubi.sad{animation:shake .5s ease}
.nubi.happy{animation:hop .6s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;
  font-size:16px;box-shadow:var(--shadow-sm);max-width:52ch}
.bubble::before{content:"";position:absolute;left:-10px;top:24px;width:16px;height:16px;background:var(--surface);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.guide{display:flex;align-items:center;gap:14px}

/* ---------- Start screen ---------- */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:18px}
.hero .nubi{width:170px}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,10vw,78px);line-height:.95;letter-spacing:-.01em;
  color:var(--brand);text-shadow:0 4px 0 var(--cloud),0 10px 24px rgba(18,40,79,.18)}
.logo small{display:block;font-size:.34em;letter-spacing:.2em;color:var(--ink-2);text-shadow:none;margin-top:8px}
.subject{color:var(--ink-2);font-size:16px;max-width:44ch}
.start-card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;text-align:left}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--surface-2);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--brand)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px}
.rule svg{flex:none;width:26px;height:26px}
.best{font-size:14px;color:var(--muted);text-align:center}

/* ---------- Map ---------- */
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.map-head h2{font-size:32px}
.map{position:relative;width:100%;max-width:560px;margin-inline:auto;aspect-ratio:560/800;max-height:max(540px,72vh)}
.map svg.trail{position:absolute;inset:0;width:100%;height:100%}
.trail .road{fill:none;stroke:var(--surface);stroke-width:16;stroke-linecap:round;opacity:.9}
.trail .dash{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:2 14;stroke-linecap:round}
.trail .done{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:0;cursor:pointer;padding:0;width:150px}
.stop .disc{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--surface);
  border:4px solid var(--line);box-shadow:0 6px 0 rgba(18,40,79,.18);transition:transform .15s}
.stop .disc svg{width:40px;height:40px}
.stop:hover .disc{transform:scale(1.06)}
.stop .lbl{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:4px 8px;text-align:center}
.stop .lbl small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stop.locked{cursor:not-allowed}
.stop.locked .disc{filter:grayscale(1);opacity:.6}
.stop.current .disc{border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.stop.done .disc{border-color:var(--ok)}
.stop.boss .disc{width:92px;height:92px;background:#2B1B3F;border-color:#8E5BD6}
.stop.boss .disc svg{width:52px;height:52px}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(18,40,79,.18),0 0 0 0 rgba(255,178,62,.6)}50%{box-shadow:0 6px 0 rgba(18,40,79,.18),0 0 0 14px rgba(255,178,62,0)}}
.stars3{display:flex;gap:2px}
.stars3 svg{width:16px;height:16px}
.stars3 .on{fill:var(--accent)}
.stars3 .off{fill:var(--heart-empty)}
.ground{position:absolute;left:0;right:0;bottom:0;height:9%;border-radius:0 0 26px 26px;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c-edge) 35%,transparent))}
.zone{position:absolute;right:4px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;opacity:.8}

/* ---------- Lesson ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.lesson-top h2{font-size:30px}
.note{min-height:280px;display:flex;flex-direction:column;gap:14px}
.note h3{font-size:26px;color:var(--brand)}
.note p,.note li{max-width:62ch}
.note ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note b,.note strong{color:var(--ink)}
.hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--accent) 45%,transparent) 55%);padding:0 2px;font-weight:700}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:26px;border-radius:6px}
.nav-row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tl div{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px}
.tl b{display:block;font-family:var(--f-display);font-size:24px;color:var(--brand)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.tile h4{margin:0;font-family:var(--f-display);font-size:19px}
.tile .tag{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:14px;color:#fff;border-radius:8px;padding:1px 8px}
.t-saas{background:var(--saas)} .t-paas{background:var(--paas)} .t-iaas{background:var(--iaas)}
.t-cloud{background:var(--c-cloud)} .t-fog{background:var(--c-fog)} .t-edge{background:var(--c-edge)}
.meter{display:flex;align-items:center;gap:8px;font-size:14px}
.meter span.k{min-width:108px;color:var(--muted)}
.meter .bars{display:flex;gap:3px}
.meter .bars i{width:14px;height:10px;border-radius:3px;background:var(--line)}
.meter .bars i.on{background:currentColor}
.proscons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.proscons ul{list-style:none;padding:0}
.proscons li{display:flex;gap:8px}
.proscons li::before{content:"+";font-weight:800;color:var(--ok)}
.proscons .cons li::before{content:"−";color:var(--bad)}
.fact{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:15px}
.layers{display:flex;flex-direction:column;gap:8px}
.layers div{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:15px}
.layers div b{font-family:var(--f-display);font-size:18px}

/* ---------- Play ---------- */
.progress{height:10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#7ED957);border-radius:999px;transition:width .4s ease}
.play-top{display:flex;align-items:center;gap:12px}
.play-top .lvl{font-family:var(--f-display);font-weight:700;color:var(--ink-2);white-space:nowrap}
.q{display:flex;flex-direction:column;gap:16px}
.q .kind{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);background:var(--surface-2);border-radius:999px;padding:3px 12px}
.q h3{font-size:clamp(22px,4.6vw,28px);font-family:var(--f-body);font-weight:700;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;background:var(--surface);
  border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;box-shadow:0 4px 0 var(--line);
  transition:transform .08s, border-color .15s, background .15s}
.opt:hover{border-color:var(--brand)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .key{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);
  font-weight:800;font-size:16px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .45s}
.opt[disabled]{cursor:default}
.opts.locked .opt:not(.right):not(.wrong){opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;flex-direction:column;gap:4px;padding:18px 10px;font-family:var(--f-display);font-weight:800;font-size:22px}
.tf .opt svg{width:40px;height:40px}
.blank{display:inline-block;min-width:110px;border-bottom:3px dashed var(--brand);text-align:center;color:var(--brand);padding:0 6px}
.blank.filled{border-bottom-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .opt{width:auto;font-family:var(--f-display);font-weight:700;font-size:19px;padding:10px 18px}

/* order */
.slots{display:grid;gap:8px}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:16px;color:var(--muted)}
.slot b{font-family:var(--f-display);font-size:20px;color:var(--brand);min-width:52px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.pool{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-items:stretch}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{height:100%;font-size:15px;padding:10px 12px}
.match .opt.sel{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.match .opt.paired{cursor:default;color:var(--ink)}
.pair-0{border-color:var(--saas)!important;box-shadow:0 4px 0 var(--saas)!important}
.pair-1{border-color:var(--paas)!important;box-shadow:0 4px 0 var(--paas)!important}
.pair-2{border-color:var(--iaas)!important;box-shadow:0 4px 0 var(--iaas)!important}
.pair-3{border-color:var(--c-cloud)!important;box-shadow:0 4px 0 var(--c-cloud)!important}

/* sort / swipe */
.sorter{display:flex;flex-direction:column;align-items:center;gap:16px}
.deck{position:relative;width:100%;max-width:440px;height:170px}
.scard{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px 22px;background:var(--surface);
  border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);font-size:19px;font-weight:700;touch-action:pan-y;
  user-select:none;transition:transform .35s ease, opacity .35s ease}
.scard.behind{transform:translateY(10px) scale(.95);opacity:.6}
.scard.fly-l{transform:translateX(-140%) rotate(-18deg);opacity:0}
.scard.fly-r{transform:translateX(140%) rotate(18deg);opacity:0}
.scard.fly-u{transform:translateY(-120%) scale(.8);opacity:0}
.scard.bad{border-color:var(--bad);animation:shake .45s}
.bins{display:grid;gap:10px;width:100%;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.bin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:14px;cursor:pointer;
  border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:18px}
.bin svg{width:34px;height:34px}
.bin small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.bin:active{transform:translateY(3px)}
.bin.flash-ok{background:var(--ok-bg);border-color:var(--ok)}
.bin.flash-bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .45s}
.swipehint{font-size:14px;color:var(--muted)}
.counter{font-family:var(--f-display);font-weight:700;color:var(--muted)}

/* scene: brake + route */
.scene{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.scene svg{display:block;width:100%;height:auto}
.freeze{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;background:var(--brand);color:var(--brand-ink);padding:4px 12px;border-radius:999px}
.readout{display:block;font-family:var(--f-mono);font-size:14px;background:#0E1A36;color:#E8F0FF;padding:7px 12px}
.layerbtns{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.layerbtns .bin{font-size:17px}
.bin.l-cloud{color:var(--c-cloud)} .bin.l-fog{color:var(--c-fog)} .bin.l-edge{color:var(--c-edge)}
.bin.l-cloud b,.bin.l-fog b,.bin.l-edge b{color:var(--ink)}
.packet{transition:transform .9s cubic-bezier(.5,.05,.3,1)}

/* feedback */
.feedback{display:flex;gap:14px;align-items:flex-start;border-radius:16px;padding:16px;border:2px solid var(--line);background:var(--surface);animation:enter .3s ease both}
.feedback.ok{border-color:var(--ok);background:var(--ok-bg)}
.feedback.ko{border-color:var(--bad);background:var(--bad-bg)}
.feedback .nubi{width:84px}
.feedback h4{margin:0 0 4px;font-family:var(--f-display);font-size:24px}
.feedback.ok h4{color:var(--ok)} .feedback.ko h4{color:var(--bad)}
.feedback .why{font-size:16px}
.feedback .fb-body{flex:1;display:flex;flex-direction:column;gap:10px}
.feedback .btn{align-self:flex-end}

/* boss */
.boss-arena{display:flex;align-items:center;gap:16px}
.boss-sprite{width:120px;flex:none}
.boss-sprite.hit{animation:hit .5s ease}
.boss-sprite.laugh{animation:hop .6s ease}
@keyframes hit{0%,100%{transform:none;filter:none}30%{transform:translateX(12px) rotate(8deg);filter:brightness(2)}}
.hpbar{flex:1;display:flex;flex-direction:column;gap:6px}
.hpbar .bar{height:16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hpbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#8E5BD6,#D14BA0);transition:width .4s}
.timer{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer.low i{background:var(--bad)}

/* modal screens */
.center-card{text-align:center;align-items:center;display:flex;flex-direction:column;gap:14px}
.big-stars{display:flex;gap:8px;justify-content:center}
.big-stars svg{width:58px;height:58px}
.big-stars .on{fill:var(--accent);animation:hgain .6s ease both}
.big-stars .off{fill:var(--heart-empty)}
.cromo{width:230px;border-radius:16px;padding:14px;background:linear-gradient(160deg,var(--brand),#4F7BD1);color:#fff;
  box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;animation:flip .8s ease both}
.cromo .art{height:92px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.cromo .art svg{width:64px;height:64px}
.cromo h4{margin:0;font-family:var(--f-display);font-size:20px}
.cromo p{font-size:14px;line-height:1.35}
.cromo .n{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.album{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.album .cromo{width:190px;animation:none}
.album .cromo.lockedc{background:var(--surface-2);color:var(--muted);border:2px dashed var(--line);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.stat{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;color:var(--brand);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.review .item{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:15px}
.review .item b{display:block}
.review .item .ans{color:var(--ok);font-weight:700}
.diploma{width:100%;border:3px solid var(--accent);border-radius:20px;padding:22px;background:
  radial-gradient(circle at 10% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 40%),var(--surface);text-align:center;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.diploma .who{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,44px);color:var(--brand)}
.diploma .rank{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--ink-2)}

/* overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,18,40,.55);display:flex;justify-content:center;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.overlay .sheet{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--surface);border-radius:20px;padding:20px;
  display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet section{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.sheet section h3{font-size:24px}
.sheet .note{min-height:0}
.locked-note{color:var(--muted);font-style:italic}

canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .nubi{width:92px}
  .hero .nubi{width:132px}
  .stop{width:118px}
  .stop .disc{width:62px;height:62px}
  .stop .disc svg{width:32px;height:32px}
  .stop.boss .disc{width:74px;height:74px}
  .stop .lbl{font-size:13px}
  .hud{gap:5px;padding:6px 7px;flex-wrap:nowrap}
  .hearts{gap:1px}
  .heart{width:19px;height:19px}
  .pill{font-size:15px;padding:2px 7px;gap:3px}
  .pill .ico{width:15px;height:15px}
  .iconbtn{width:34px;height:34px}
  .iconbtn svg{width:19px;height:19px}
  .subtxt{display:none}
  .lesson-top h2{font-size:26px}
  .match{grid-template-columns:1fr 1fr;gap:8px}
  .match .opt{font-size:14px;padding:8px}
  .feedback{flex-direction:column}
  .feedback .nubi{width:64px}
  .layers div{grid-template-columns:72px 1fr}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
"use strict";
(() => {
/* =========================================================
   CONTENIDOS · UT3 Sistemas en la nube (Cloud)
   Tipos de reto: mc (test), fill (completa), tf (verdadero/falso),
   order (ordenar), match (emparejar), sort (clasificar),
   brake (mini-juego del coche), route (enrutar datos).
   En mc/fill, la PRIMERA opción es la correcta (se barajan al jugar).
   ========================================================= */
const MORE = {
  internet:{href:"https://www.youtube.com/watch?v=1CDWKWakX1o",txt:"Vídeo: el origen de internet (y de la nube)"},
  dc:{href:"https://www.youtube.com/watch?v=F5hnaTySeis",txt:"Vídeo: qué es un data center"},
  space:{href:"https://www.youtube.com/watch?v=3jtSx8oG5ZI",txt:"Vídeo: ¿centros de datos en el espacio?"},
  arsys:{href:"https://www.arsys.es/cloud",txt:"Ejemplo: servidores cloud de Arsys"},
  hack:{href:"https://www.youtube.com/watch?v=G_-KK_TFX_k",txt:"Vídeo: el hackeo al Banco Santander"}
};
const meter = (label, sym, n, color) =>
  `<div class="meter" style="color:${color}"><span class="k">${label}</span><span class="bars">${
    [1,2,3,4,5,6].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span><b>${sym}</b></div>`;

const LEVELS = [
/* ---------------- NIVEL 1 ---------------- */
{
  id:"nube", title:"¿Qué es la nube?", short:"Qué es la nube", icon:"i-cloud",
  intro:"Empezamos por lo básico: qué es la nube y de dónde viene.",
  lesson:[
    {h:"La nube, en una frase", body:`
      <p style="font-size:1.2em">La nube es <span class="hl">el ordenador de otra persona, al que accedemos por internet</span>.</p>
      <p><b>Definición:</b> el <i>cloud</i> o nube es un servicio que ofrece <b>almacenamiento masivo, aplicaciones y mantenimiento de equipos</b> fuera de la empresa o de tu ubicación.</p>
      <p>Permite acceder a la información <b>desde cualquier lugar o dispositivo</b> con conexión a internet.</p>`},
    {h:"Breve historia de la nube", body:`
      <div class="tl">
        <div><b>1960</b><strong>John McCarthy</strong> gesta la idea: la informática puede <b>venderse como un servicio público</b>, como la luz o el agua.</div>
        <div><b>1999</b><strong>Salesforce</strong> la pone en práctica: ofrece una aplicación a través de internet. Arranca el crecimiento del cloud.</div>
        <div><b>2002</b><strong>Amazon</strong> pone en marcha <b>AWS</b> (Amazon Web Services): almacenamiento y computación por internet.</div>
        <div><b>2009</b><strong>Google, Microsoft</strong> y otras empresas empiezan a ofrecer cloud computing.</div>
      </div>`, more:["internet"]}
  ],

{

  intro:"Hay tres maneras de usar la nube. Te las explico con un restaurante.",
  lesson:[
    {h:"Imagina un restaurante", body:`
      <p>Usuarios y empresas podemos acceder a la nube de <b>3 maneras</b>. Piénsalo como si quisieras organizar una cena:</p>
      <div class="grid3">
        <div class="tile"><span class="tag t-saas">SaaS</span><h4>Solo disfrutas</h4>No cocinas ni limpias. No necesitas saber nada de cocina.<span><b>Nube:</b> recibes un servicio directo.</span></div>
        <div class="tile"><span class="tag t-paas">PaaS</span><h4>Restaurante ya montado</h4>Cocina equipada, horno, mesas… pero las recetas las haces tú.<span><b>Nube:</b> alquilas un servidor premontado.</span></div>
        <div class="tile"><span class="tag t-iaas">IaaS</span><h4>Local vacío</h4>Alquilas el local y lo montas todo tú.<span><b>Nube:</b> alquilas un servidor vacío.</span></div>
      </div>`},
    {h:"SaaS · Software como Servicio", body:`
      <p><span class="hl">Todo montado: recibimos el servicio.</span> Entras, inicias sesión y lo usas.</p>
      <p><b>Ejemplos reales:</b> Gmail, Netflix, Dropbox, Spotify.</p>
      ${meter("Contratación","++",5,"var(--saas)")}${meter("Mantenimiento","−−",2,"var(--saas)")}`},
    {h:"PaaS · Plataforma como Servicio", body:`
      <p><span class="hl">Te dan el servidor funcionando y tú creas el software.</span></p>
      <p>Mantener los servidores funcionando requiere personal de guardia, y de eso se encarga el proveedor. Por ejemplo, las plataformas para crear tu propia web: el servidor ya está listo y tú pones tu proyecto.</p>
      ${meter("Contratación","−",3,"var(--paas)")}${meter("Mantenimiento","+",4,"var(--paas)")}`},
    {h:"IaaS · Infraestructura como Servicio", body:`
      <p><span class="hl">Alquilas un servidor vacío en internet.</span> Tú lo mantienes online y tú instalas el software.</p>
      <p>Por ejemplo, montas tu propia app (como la de la cafetería del centro) y vigilas tú el disco, la RAM, la CPU y que el servidor web siga activo. Hay empresas, como Arsys, que ofrecen estos servidores a bajo coste.</p>
      ${meter("Contratación","−−−",1,"var(--iaas)")}${meter("Mantenimiento","+++",6,"var(--iaas)")}
      <p class="fact"><b>A cambio, ganas privacidad:</b> los datos y el servidor los controlas tú. De SaaS a IaaS baja el coste de contratación y sube el de mantenimiento.</p>`,

{
  id:"capas", title:"Cloud, Fog y Edge", short:"Cloud · Fog · Edge", icon:"i-layers",
  intro:"¿Dónde se procesan los datos? Depende de lo rápido que haya que decidir.",
  lesson:[
    {h:"¿Dónde se gestionan los datos?", body:`
      <p>No todo se procesa en el mismo sitio. Cuanto más lejos está el ordenador que procesa, más potencia tiene… pero hay <span class="hl">más latencia</span>: el retraso al enviar y recibir datos.</p>
      <div class="layers">
        <div><b style="color:var(--c-cloud)">Cloud</b><span>Centros de datos a cientos o miles de km. Mucha potencia, alta latencia.</span></div>
        <div><b style="color:var(--c-fog)">Fog</b><span>La red local (LAN) de un edificio o fábrica. Hace de intermediario.</span></div>
        <div><b style="color:var(--c-edge)">Edge</b><span>El propio dispositivo, o a un solo salto de red (antenas 5G). Retraso casi cero.</span></div>
      </div>`},
    {h:"Cloud · La nube", body:`
      <ul>
        <li><b>Dónde está:</b> en enormes centros de datos centralizados, a cientos o miles de kilómetros (por ejemplo, los servidores de Google o AWS).</li>
        <li><b>Función:</b> procesamiento masivo, almacenamiento a largo plazo y análisis de Big Data (Machine Learning complejo).</li>
        <li><b>Problema:</b> <span class="hl">alta latencia</span>. Tarda milisegundos o segundos en enviar y recibir datos, algo inaceptable para decisiones críticas, como un coche autónomo que necesita frenar.</li>
      </ul>`},
    {h:"Fog · La niebla", body:`
      <ul>
        <li><b>Dónde está:</b> en la red de área local (LAN), en routers, gateways o servidores locales dentro de un edificio o fábrica.</li>
        <li><b>Función:</b> hace de <span class="hl">intermediario</span>. Recoge los datos de miles de sensores, filtra lo que no sirve, toma decisiones locales que necesitan cierta potencia y solo envía a la nube el resumen o los datos históricos.</li>
        <li><b>Ejemplo:</b> el servidor de un parque eólico analiza el viento de todos los molinos en tiempo real para girarlos, y solo manda a la nube un informe diario de la energía generada.</li>
      </ul>`},
    {h:"Edge · El borde", body:`
      <ul>
        <li><b>Dónde está:</b> en el propio dispositivo inteligente o a un solo «salto» de red (antenas 5G).</li>
        <li><b>Función:</b> procesamiento inmediato <span class="hl">sin depender de internet</span>. Toma decisiones críticas en tiempo real porque el retraso debe ser cero.</li>
        <li><b>Ejemplo:</b> la cámara inteligente de un Toyota Yaris (sistema PCS) detecta un peatón y clava los frenos al instante. No manda el vídeo a la nube: lo procesa el chip de la propia cámara o del coche en milisegundos.</li>
      </ul>
      <p class="fact">Un coche moderno lleva radar/LIDAR, cámaras y ultrasonidos para el frenado de emergencia, el mantenimiento de carril, el control de velocidad adaptativo, el ángulo muerto o el aparcamiento. Todo eso se decide en el borde.</p>`}
  ],
  challenges:[
    {type:"brake", q:"¡La cámara del coche detecta un peatón cruzando! El tiempo se congela: ¿dónde procesas la imagen para decidir si frenar?",
      why:"Edge: el chip del coche decide en milisegundos y sin depender de internet. Si el vídeo viaja a la nube o a otro servidor, la latencia hace que el coche frene tarde."},
    {type:"route", q:"Enruta los datos: toca la capa donde debe procesarse cada tarea.",
      items:[{t:"Entrenar un modelo de Machine Learning con años de datos",layer:"cloud"},
             {t:"Parque eólico: analizar en tiempo real el viento de todos los molinos para girarlos",layer:"fog"},
             {t:"Un dispositivo que debe decidir en tiempo real aunque no haya internet",layer:"edge"},
             {t:"Guardar a largo plazo el histórico de toda la empresa",layer:"cloud"},
             {t:"Fábrica: filtrar los datos de miles de sensores y enviar solo un resumen a la nube",layer:"fog"}],
      why:"Cloud: potencia y almacenamiento a largo plazo. Fog: intermediario local que filtra y resume. Edge: decisiones instantáneas en el propio dispositivo."},
    {type:"mc", q:"¿Cuál es el gran problema de la nube (cloud) para tomar decisiones críticas?",
      a:["La alta latencia: tarda milisegundos o segundos en enviar y recibir datos","Que no puede almacenar datos durante mucho tiempo","Que tiene muy poca potencia de cálculo","Que solo funciona con cable"],
      why:"La nube tiene muchísima potencia, pero está lejos: esa latencia es inaceptable para frenar un coche."},
    {type:"mc", q:"¿Dónde se sitúa el Fog computing?",
      a:["En la red local (LAN): routers, gateways o servidores de un edificio o fábrica","Dentro del chip de cada sensor","En centros de datos a miles de kilómetros","En satélites en órbita"],
      why:"La niebla está «a media altura»: en la LAN, entre los dispositivos y la nube."},
    {type:"tf", q:"El Edge computing puede tomar decisiones aunque no haya conexión a internet.", v:true,
      why:"Procesa en el propio dispositivo, sin depender de internet. Por eso sirve para decisiones críticas."},
    {type:"fill", q:"El Edge está en el propio dispositivo o a un solo «salto» de red, como las antenas ___.",
      a:["5G","de TV","de radio FM","parabólicas"], why:"Las antenas 5G están a un único salto de red del dispositivo."}
  ],
  cromo:{title:"Frenada Edge", icon:"i-chip", text:"La cámara del coche ve un peatón y frena en milisegundos, sin preguntar a la nube."}
},

/* ---------------- Sonido (sintetizado, sin archivos) ---------------- */
const Sound = (() => {
  let ctx = null, on = store.get("sound", true);
  function ensure() {
    if (!on) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = "sine", vol = 0.14, when = 0, slideTo = null) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    get on() { return on; },
    toggle() { on = !on; store.set("sound", on); if (on) this.click(); return on; },
    click() { tone(660, .06, "triangle", .07); },
    ok() { [523, 659, 784].forEach((f, i) => tone(f, .14, "triangle", .13, i * .07)); },
    ko() { tone(233, .3, "sawtooth", .08, 0, 110); },
    gain() { [660, 880, 1175].forEach((f, i) => tone(f, .12, "sine", .12, i * .06)); },
    level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "triangle", .13, i * .1)); tone(1047, .5, "sine", .09, .42); },
    over() { [392, 330, 262, 196].forEach((f, i) => tone(f, .28, "triangle", .12, i * .2)); },
    win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .16, "triangle", .13, i * .1)); },
    hit() { tone(170, .14, "square", .1, 0, 80); tone(900, .08, "triangle", .07, .03); },
    tick() { tone(1250, .03, "square", .035); },
    whoosh() { tone(260, .5, "sine", .05, 0, 1300); },
    brake() { tone(900, .35, "sawtooth", .04, 0, 400); }

})();

function renderHUD(change) {
  const h = $("#hearts");
  h.innerHTML = Array.from({ length: MAX_LIVES }, (_, i) => {
    const off = i >= S.lives;
    let anim = "";
    if (change === "lose" && i === S.lives) anim = "break";

    return `<svg class="heart ${off ? "off" : ""} ${anim}" viewBox="0 0 24 24"><use href="#i-heart"/></svg>`;
  }).join("");
  h.setAttribute("aria-label", `Vidas: ${S.lives} de ${MAX_LIVES}`);

function popScore(text, anchor, bad = false) {
  const r = anchor ? anchor.getBoundingClientRect() : { left: innerWidth / 2, width: 0, top: innerHeight / 2 };
  const d = document.createElement("div");
  d.className = "score-pop" + (bad ? " bad" : "");
  d.textContent = text;
  d.style.left = (r.left + r.width / 2) + "px";
  d.style.top = Math.max(60, r.top - 10) + "px";
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}

/* Acierto / fallo de un paso. pts = puntos base del paso */
function scoreStep(ok, anchor, pts = 100, mistake) {
  if (ok) {
    S.correct++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    const gained = pts + 20 * Math.min(S.streak - 1, 5);
    S.score += gained;
    popScore("+" + gained, anchor);
    Sound.ok();
    renderHUD();
  } else {
    S.wrong++; S.streak = 0;
    if (P) P.lost++;
    S.lives = Math.max(0, S.lives - 1);
    if (mistake) S.mistakes.push(mistake);
    popScore("−1 ♥", anchor, true);
    Sound.ko();
    renderHUD("lose");
  }
}

  const fb = $("#fb");

  const bar = $(".progress i");
  if (bar && P.list) bar.style.width = ((P.i + 1) / P.list.length) * 100 + "%";
  const title = opts.title || (ok ? pick(OK_T) : pick(KO_T));
  fb.innerHTML = `<div class="feedback ${ok ? "ok" : "ko"}">${nubi(ok ? "happy" : "sad")}
    <div class="fb-body"><h4>${title}</h4><p class="why">${why}</p>
    <button class="btn ${dead ? "" : "gold"}" id="cont" type="button">${dead ? "Ver resultado" : (opts.nextLabel || "Continuar →")}</button></div></div>`;
  announce(title + ". " + stripTags(why));
  let used = false;
  const go = () => {
    if (used) return; used = true;
    Sound.click();
    if (S.lives <= 0) return screenGameOver();
    (opts.onNext || next)();
  };
  $("#cont").addEventListener("click", go);
  keymap = { Enter: go, " ": go };
  $("#cont").focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "nearest" });
}
function finishMulti(errs, c) {
  $$("#qcard button").forEach(b => (b.disabled = true));
  const ok = errs === 0;
  const title = ok ? pick(OK_T) : S.lives <= 0 ? "¡Te has quedado sin vidas!" : `Reto completado con ${errs} ${errs === 1 ? "fallo" : "fallos"}`;
  feedback(ok, esc(c.why), { title });
}
function restartAnim(elm, cls) { elm.classList.remove(cls); void elm.getBoundingClientRect(); elm.classList.add(cls); }

/* ---------- Test y Completa la frase ---------- */
function rMC(c, fill = false) {
  const opts = shuffle(c.a.map((t, k) => ({ t, ok: k === 0 })));
  const good = opts.find(o => o.ok);
  const qHTML = fill ? esc(c.q).replace("___", `<span class="blank" id="blank">?</span>`) : esc(c.q);
  setView(frame(`<span class="kind">${KIND[c.type]}</span><h3>${qHTML}</h3>
    <div class="${fill ? "chips" : "opts"}" id="opts">${opts.map((o, k) =>
      `<button class="opt" type="button">${fill ? "" : `<span class="key">${k + 1}</span>`}<span>${esc(o.t)}</span></button>`).join("")}</div>`));
  const box = $("#opts"), btns = $$("#opts .opt");
  const choose = k => {
    if (box.classList.contains("locked")) return;
    box.classList.add("locked");
    btns.forEach(b => (b.disabled = true));
    const o = opts[k], b = btns[k];
    btns[opts.indexOf(good)].classList.add("right");
    if (fill) { const bl = $("#blank"); bl.textContent = good.t; bl.classList.add("filled"); }
    if (!o.ok) b.classList.add("wrong");
    scoreStep(o.ok, b, 100, o.ok ? null : mistake(c.q.replace("___", "…"), good.t, c.why));
    feedback(o.ok, (o.ok ? "" : `La respuesta correcta es <b>${esc(good.t)}</b>. `) + esc(c.why));
  };
  btns.forEach((b, k) => b.addEventListener("click", () => choose(k)));
  opts.forEach((_, k) => (keymap[String(k + 1)] = () => choose(k)));
}
function rFill(c) { rMC(c, true); }

/* ---------- Verdadero o falso ---------- */

/* ---------- Ordenar (línea del tiempo) ---------- */
function rOrder(c) {

/* ---------- Emparejar ---------- */
function rMatch(c) {
  const left = c.pairs.map((p, k) => ({ t: p[0], k }));
  const right = shuffle(c.pairs.map((p, k) => ({ t: p[1], k })));
  setView(frame(`<span class="kind">${KIND.match}</span><h3>${esc(c.q)}</h3>
    <p class="swipehint">Toca un elemento de cada columna para unirlos.</p>
    <div class="match">
      <div class="col">${left.map(o => `<button class="opt" type="button" data-k="${o.k}" data-side="L">${esc(o.t)}</button>`).join("")}</div>
      <div class="col">${right.map(o => `<button class="opt" type="button" data-k="${o.k}" data-side="R">${esc(o.t)}</button>`).join("")}</div>
    </div>`));
  let sel = null, matched = 0, errs = 0;
  $$(".match .opt").forEach(b => b.addEventListener("click", () => {
    if (b.classList.contains("paired") || S.lives <= 0) return;
    if (!sel || sel.dataset.side === b.dataset.side) {
      if (sel) sel.classList.remove("sel");
      sel = b; b.classList.add("sel"); Sound.click();
      return;
    }
    const a = sel; sel = null; a.classList.remove("sel");
    if (a.dataset.k === b.dataset.k) {
      [a, b].forEach(x => { x.classList.add("paired", "pair-" + (+x.dataset.k % 4)); x.disabled = true; });
      matched++;
      scoreStep(true, b, 60);
      if (matched === c.pairs.length) finishMulti(errs, c);
    } else {
      errs++;
      [a, b].forEach(x => restartAnim(x, "wrong"));
      later(() => [a, b].forEach(x => x.classList.remove("wrong")), 650);
      scoreStep(false, b, 0, errs === 1 ? mistake(c.q, c.pairs.map(p => `${p[0]} = ${p[1]}`).join(" · "), c.why) : null);
      if (S.lives <= 0) finishMulti(errs, c);
    }
  }));
}

/* ---------- Clasificar (con deslizamiento si hay 2 cajas) ---------- */
function rSort(c) {
  const cards = shuffle(c.cards), bins = c.bins;
  setView(frame(`<span class="kind">${KIND.sort}</span><h3>${esc(c.q)}</h3>
    <div class="sorter">
      <span class="counter" id="cnt"></span>
      <div class="deck" id="deck"></div>
      ${c.swipe ? `<p class="swipehint">Desliza la tarjeta hacia un lado o toca un botón. Con teclado: ← y →.</p>` : ""}
      <div class="bins" id="bins">${bins.map(b => `<button class="bin" type="button">${b.icon ? icon(b.icon) : ""}<span>${esc(b.label)}</span>${b.sub ? `<small>${esc(b.sub)}</small>` : ""}</button>`).join("")}</div>
    </div>`));
  const deck = $("#deck"), binBtns = $$("#bins .bin");
  let i = 0, errs = 0, busy = false;
  const flyFor = id => bins.length === 2 ? (bins[0].id === id ? "fly-l" : "fly-r") : "fly-u";
  function draw() {
    const pair = cards.slice(i, i + 2);
    deck.innerHTML = pair.map((cd, j) => `<div class="scard ${j === 1 ? "behind" : ""}">${esc(cd.t)}</div>`).reverse().join("");
    $("#cnt").textContent = `Tarjeta ${i + 1} de ${cards.length}`;
    if (c.swipe) enableSwipe(deck.lastElementChild);
  }
  function advance() { i++; busy = false; if (i >= cards.length) finishMulti(errs, c); else draw(); }
  function choose(k) {
    if (busy || i >= cards.length || S.lives <= 0) return;
    busy = true;
    const cd = cards[i], top = deck.lastElementChild, btn = binBtns[k];
    const ok = bins[k].id === cd.bin;
    if (ok) {
      restartAnim(btn, "flash-ok"); later(() => btn.classList.remove("flash-ok"), 450);
      top.classList.add(flyFor(cd.bin));
      scoreStep(true, btn, 60);
      later(advance, 380);
    } else {
      errs++;
      restartAnim(btn, "flash-bad"); later(() => btn.classList.remove("flash-bad"), 550);
      const good = bins.find(b => b.id === cd.bin);
      top.classList.add("bad");
      top.innerHTML = `<span>${esc(cd.t)}<small style="display:block;margin-top:8px;color:var(--bad);font-size:15px">Va en: ${esc(good.label)}</small></span>`;
      scoreStep(false, btn, 0, mistake(cd.t, good.label, c.why));
      if (S.lives <= 0) { busy = false; return finishMulti(errs, c); }
      later(() => { top.classList.remove("bad"); top.classList.add(flyFor(cd.bin)); }, 1300);
      later(advance, 1700);
    }
  }
  function enableSwipe(card) {
    let x0 = null, dx = 0;
    card.addEventListener("pointerdown", e => { if (busy) return; x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
    card.addEventListener("pointermove", e => { if (x0 === null) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 16}deg)`; });
    const end = () => {
      if (x0 === null) return;
      x0 = null; card.style.transition = "";
      if (Math.abs(dx) > 70) choose(dx < 0 ? 0 : 1);
      card.style.transform = "";
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }
  binBtns.forEach((b, k) => b.addEventListener("click", () => choose(k)));
  bins.forEach((_, k) => (keymap[String(k + 1)] = () => choose(k)));
  if (bins.length === 2) { keymap.ArrowLeft = () => choose(0); keymap.ArrowRight = () => choose(1); }
  draw();
}

    <div class="art">${icon(locked ? "i-lock" : L.cromo.icon)}</div>
    <h4>${locked ? "Sin conseguir" : esc(L.cromo.title)}</h4>
    <p>${locked ? "Supera este nivel para conseguirlo." : esc(L.cromo.text)}</p></div>`;
}
function stat(value, label) { return `<div class="stat"><b>${value}</b><span>${label}</span></div>`; }
function totalStars() { return LEVELS.reduce((n, L) => n + (S.stars[L.id] || 0), 0); }
function saveBest() {
  const best = store.get("best", null);
  if (!best || S.score > best.score) store.set("best", { score: S.score, name: S.name });
}

function levelComplete() {
  const L = P.L, lost = P.lost;
  const stars = lost === 0 ? 3 : lost === 1 ? 2 : 1;
  S.stars[L.id] = Math.max(S.stars[L.id] || 0, stars);
  let bonusLife = false, bonusPts = 0;
  if (lost === 0) { bonusPts = 300; S.score += bonusPts; if (S.lives < MAX_LIVES) { S.lives++; bonusLife = true; } }
  if (!S.cromos.includes(L.id)) S.cromos.push(L.id);
  S.unlocked = Math.max(S.unlocked, P.idx + 2);
  setView(`<div class="card center-card">
      <p class="eyebrow">Nivel ${P.idx + 1} superado</p>
      <h2 style="font-size:clamp(28px,6vw,38px)">${esc(L.title)}</h2>
      <div class="big-stars" aria-label="${stars} de 3 estrellas">${[1, 2, 3].map(n => `<svg viewBox="0 0 24 24" class="${n <= stars ? "on" : "off"}" style="animation-delay:${n * .18}s"><use href="#i-star"/></svg>`).join("")}</div>
      <p>${lost === 0 ? "¡Nivel perfecto, sin ningún fallo!" : `Has fallado ${lost} ${lost === 1 ? "vez" : "veces"} en este nivel. Si lo haces sin fallos, recuperas una vida.`}</p>
      <div class="row center">
        ${bonusPts ? `<span class="pill">${icon("i-coin", "ico")}+${bonusPts} de bonus</span>` : ""}
        ${bonusLife ? `<span class="pill">${icon("i-heart", "ico")}¡Recuperas una vida!</span>` : ""}
      </div>
      <p class="eyebrow">Nuevo cromo para tu álbum</p>
      ${cromoHTML(L, P.idx)}
      <button class="btn big gold" id="cont" type="button">${P.idx + 1 < LEVELS.length ? "Seguir la misión →" : "¡Al jefe final! →"}</button>
    </div>`, "map");
  renderHUD(bonusLife ? "gain" : null);
  Sound.level();
  if (bonusLife) later(() => Sound.gain(), 650);
  confetti(stars === 3 ? 140 : 70);
  announce(`Nivel superado con ${stars} estrellas.`);
  const go = () => { Sound.click(); screenMap(); };
  $("#cont").addEventListener("click", go);
  $("#cont").focus({ preventScroll: true });
}

/* ---------------- Jefe final ---------------- */
let B = null;
function bossSprite(extra = "") { return `<svg class="boss-sprite ${extra}" id="boss" viewBox="0 0 48 48" role="img" aria-label="El Hacker"><use href="#i-hacker"/></svg>`; }
function screenBossIntro() {
  setView(`<div class="card center-card">
      ${bossSprite()}
      <p class="eyebrow">Jefe final</p>
      <h2 style="font-size:clamp(30px,6vw,40px)">El Hacker</h2>
      <p style="max-width:52ch">${esc(BOSS.intro)}</p>
      <div class="rules" style="width:100%;text-align:left">
        <div class="rule">${icon("i-bolt")}<span>Tienes <b>${BOSS.time} segundos</b> por pregunta.</span></div>
        <div class="rule">${icon("i-hacker")}<span>Acierta <b>${BOSS.hp} preguntas</b> para expulsarlo.</span></div>
        <div class="rule">${icon("i-coin")}<span>Cuanto antes respondas, <b>más puntos</b>.</span></div>
        <div class="rule">${icon("i-heart")}<span>Mezcla preguntas de <b>toda la unidad</b>.</span></div>
      </div>
      <button class="btn big gold" id="go" type="button">¡A por él!</button>
    </div>`, "map");
  $("#go").addEventListener("click", () => { Sound.click(); startBoss(); });
  $("#go").focus({ preventScroll: true });
}
function startBoss() {
  P = { idx: LEVELS.length, L: BOSS, lost: 0, list: null };
  B = { hp: BOSS.hp, qs: shuffle(BOSS.pool), i: 0 };
  bossQuestion();
}
function bossQuestion() {
  if (B.i >= B.qs.length) B.qs = B.qs.concat(shuffle(BOSS.pool));
  const c = B.qs[B.i];
  const opts = shuffle(c.a.map((t, k) => ({ t, ok: k === 0 })));
  const good = opts.find(o => o.ok);
  setView(`<div class="boss-arena">${bossSprite()}
      <div class="hpbar"><span class="eyebrow">Defensa del hacker</span>
        <div class="bar" role="progressbar" aria-label="Defensa del hacker" aria-valuemin="0" aria-valuemax="${BOSS.hp}" aria-valuenow="${B.hp}"><i style="width:${(B.hp / BOSS.hp) * 100}%"></i></div>
        <span class="counter">Le quedan ${B.hp} de ${BOSS.hp} · Ataque ${B.i + 1}</span></div></div>
    <article class="card q" id="qcard">
      <div class="timer" id="timer"><i></i></div>
      <span class="kind">Pregunta relámpago</span>
      <h3>${esc(c.q)}</h3>
      <div class="opts" id="opts">${opts.map((o, k) => `<button class="opt" type="button"><span class="key">${k + 1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    </article><div id="fb"></div>`, "play");
  const btns = $$("#opts .opt"), bar = $("#timer i"), total = BOSS.time * 1000, t0 = performance.now();
  let over = false, lastSec = BOSS.time;
  const tick = now => {
    if (over) return;
    const left = Math.max(0, total - (now - t0));
    bar.style.width = (left / total) * 100 + "%";
    const sec = Math.ceil(left / 1000);
    if (left <= 5000) { $("#timer").classList.add("low"); if (sec < lastSec) Sound.tick(); }
    lastSec = sec;
    if (left <= 0) return resolve(-1, 0);
    window.__bossTick = requestAnimationFrame(tick);
  };
  window.__bossTick = requestAnimationFrame(tick);
  function resolve(k, leftMs) {
    if (over) return; over = true;
    cancelAnimationFrame(window.__bossTick);
    $("#opts").classList.add("locked");
    btns.forEach(b => (b.disabled = true));
    btns[opts.indexOf(good)].classList.add("right");
    const ok = k >= 0 && opts[k].ok;
    if (k >= 0 && !ok) btns[k].classList.add("wrong");
    const boss = $("#boss");
    if (ok) {
      B.hp--;
      const bonus = Math.round(leftMs / 1000) * 10;
      scoreStep(true, btns[k], 100 + bonus);
      Sound.hit(); restartAnim(boss, "hit");
      $(".hpbar .bar i").style.width = (B.hp / BOSS.hp) * 100 + "%";
    } else {
      scoreStep(false, k >= 0 ? btns[k] : $("#timer"), 0, mistake(c.q, good.t, c.why));
      restartAnim(boss, "laugh");
    }
    B.i++;
    const win = B.hp <= 0;
    const title = ok ? (win ? "¡Hacker expulsado!" : "¡Golpe crítico!") : k < 0 ? "¡Se acabó el tiempo! Pierdes una vida" : pick(KO_T);
    feedback(ok, (ok ? "" : `La respuesta correcta es <b>${esc(good.t)}</b>. `) + esc(c.why),
      { title, nextLabel: win ? "Ver mi diploma →" : "Siguiente ataque →", onNext: win ? screenWin : bossQuestion });
  }
  btns.forEach((b, k) => b.addEventListener("click", () => resolve(k, total - (performance.now() - t0))));
  opts.forEach((_, k) => (keymap[String(k + 1)] = () => resolve(k, total - (performance.now() - t0))));
}

/* ---------------- Game over ---------------- */
function screenGameOver() {
  Sound.over();
  saveBest();
  const idx = Math.min(S.unlocked - 1, ALL.length - 1), reached = ALL[idx];
  const where = reached === BOSS ? "el jefe final" : `el nivel ${idx + 1} · ${esc(reached.title)}`;
  setView(`<div class="card center-card">
      ${nubi("sad")}
      <p class="eyebrow">Fin de la partida</p>
      <h2 style="font-size:clamp(28px,6vw,38px)">¡Te has quedado sin vidas!</h2>
      <p style="max-width:54ch">Has llegado hasta <b>${where}</b>. Repasa tus fallos y vuelve a intentarlo: seguro que esta vez llegas más lejos.</p>
      <div class="stats">
        ${stat(S.score.toLocaleString("es-ES"), "puntos")}
        ${stat(S.correct, "aciertos")}
        ${stat(S.bestStreak, "mejor racha")}
        ${stat(totalStars() + "/" + LEVELS.length * 3, "estrellas")}
      </div>
      <h3 style="font-size:24px">Lo que tienes que repasar</h3>
      <div class="review">${S.mistakes.map(m => `<div class="item"><span class="eyebrow">${esc(m.lvl)}</span>
        <b>${esc(m.q)}</b><span>Respuesta correcta: <span class="ans">${esc(m.a)}</span></span>
        <p style="font-size:14px;color:var(--ink-2);margin-top:4px">${esc(m.why)}</p></div>`).join("")}</div>
      <div class="row center">
        <button class="btn ghost" id="rev" type="button">Repasar apuntes</button>
        <button class="btn big gold" id="retry" type="button">Reintentar la misión</button>
      </div>
    </div>`, "none");
  $("#rev").addEventListener("click", openNotes);
  $("#retry").addEventListener("click", () => { S = newState(S.name); Sound.gain(); screenMap(); });
  $("#retry").focus({ preventScroll: true });
}

/* ---------------- Victoria ---------------- */
function screenWin() {
  S.unlocked = ALL.length + 1;
  const acc = Math.round((S.correct / Math.max(1, S.correct + S.wrong)) * 100);
  const rank = acc >= 95 ? "Leyenda de la Nube" : acc >= 85 ? "Maestría Cloud" : acc >= 70 ? "Guía de la Niebla" : "Patrulla del Borde";
  const lifeBonus = S.lives * 200;
  S.score += lifeBonus;
  saveBest();
  const date = new Date().toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
  setView(`<div class="card center-card">
      <div class="diploma">
        ${nubi("happy")}
        <p class="eyebrow">Diploma · Misión Nube · UT3</p>
        <p>Se certifica que</p>
        <p class="who">${esc(S.name || "Piloto sin nombre")}</p>
        <p style="max-width:46ch">ha completado la misión <b>Sistemas en la nube (Cloud)</b> y ha expulsado al hacker con el rango de</p>
        <p class="rank">${rank}</p>
        ${starsHTML(Math.max(1, Math.round(totalStars() / LEVELS.length)), "big-stars")}
        <p class="best">${date}</p>
      </div>
      <div class="stats">
        ${stat(S.score.toLocaleString("es-ES"), "puntos")}
        ${stat(acc + "%", "precisión")}
        ${stat(S.bestStreak, "mejor racha")}
        ${stat(S.lives + "/" + MAX_LIVES, "vidas restantes")}
        ${stat(totalStars() + "/" + LEVELS.length * 3, "estrellas")}
      </div>
      <p>Bonus por vidas restantes: <b>+${lifeBonus}</b> puntos.</p>
      <h3 style="font-size:24px">Tu álbum de cromos</h3>
      <div class="album">${LEVELS.map((L, i) => cromoHTML(L, i, !S.cromos.includes(L.id))).join("")}</div>
      <div class="row center">
        <button class="btn ghost" id="rev" type="button">Ver apuntes</button>
        <button class="btn big gold" id="again" type="button">Jugar otra vez</button>
      </div>
    </div>`, "none");
  Sound.win();
  confetti(240);
  announce(`¡Misión cumplida! Rango: ${rank}. ${S.score} puntos.`);
  $("#rev").addEventListener("click", openNotes);
  $("#again").addEventListener("click", () => { Sound.click(); screenStart(); });
}

/* ---------------- Confeti ---------------- */
function confetti(n = 120) {
  if (reduceMotion()) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.hidden = false; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#FFB23E", "#3E7BE0", "#2A9A55", "#EF4B5C", "#7B5CE0", "#1E9C9C", "#FFFFFF"];
  const parts = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .5, y: H * .38,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: colors[(Math.random() * colors.length) | 0]
  }));
  const t0 = performance.now();
  const id = (confetti.id = (confetti.id || 0) + 1);
  (function loop(t) {
    if (id !== confetti.id) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
    if (t - t0 < 3200) requestAnimationFrame(loop);
    else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

/* ---------------- Arranque ---------------- */
function boot() {
  buildSky();
  $("#btnSound").addEventListener("click", () => { Sound.toggle(); renderHUD(); });
  $("#btnNotes").addEventListener("click", () => { Sound.click(); openNotes(); });
  $("#btnCloseNotes").addEventListener("click", closeNotes);
  $("#notes").addEventListener("click", e => { if (e.target.id === "notes") closeNotes(); });
  document.addEventListener("keydown", e => {
    if (!$("#notes").hidden) { if (e.key === "Escape") closeNotes(); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("button, a")) return;
    const f = keymap[e.key] || keymap[e.key.toLowerCase()];
    if (f) { e.preventDefault(); f(); }
  });
  screenStart();
}
boot();
})();
</script>
