:root {
  color-scheme: dark;
  --ink: #0f0b1e; --ink2: #171230; --panel: #211a3f; --panel2: #2c2356; --line: #6b5cc4; --line2: #a99bf0;
  --text: #f4f0ff; --muted: #b4aad8; --gold: #ffc94a; --gold2: #d98e22; --gold3: #fff0b8;
  --cyan: #4fe3d0; --red: #ff6b6b; --green: #8be07e;
  --f-ui: 'Pixelify Sans', 'Courier New', monospace; --f-mono: 'VT323', 'Courier New', monospace;
  --notch: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-ui); font-size: 16px; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
b { color: var(--gold); font-weight: 700; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: stretch; background: radial-gradient(120% 80% at 50% 0%, #1d1640 0%, var(--ink) 70%);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

/* ---------- barra superior ---------- */
#top { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 48px; background: var(--ink2); border-bottom: 3px solid var(--panel2); z-index: 5; }
#where { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
#ut { flex: none; font-weight: 700; font-size: 14px; color: var(--ink); background: var(--cyan); padding: 3px 7px 2px; clip-path: var(--notch); letter-spacing: .04em; }
#place { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-r { display: flex; align-items: center; gap: 6px; }
#cardsN { font-family: var(--f-mono); font-size: 20px; color: var(--gold); padding: 0 4px; font-variant-numeric: tabular-nums; }
.ib { position: relative; display: inline-flex; align-items: center; gap: 6px; min-width: 40px; height: 38px; padding: 0 8px; border: 0; background: var(--panel2); clip-path: var(--notch); box-shadow: inset 0 -3px 0 #1a1438; }
.ib:active { transform: translateY(2px); box-shadow: none; }
.ib i { display: block; width: 24px; height: 24px; background: center / contain no-repeat; image-rendering: pixelated; }
.ib .lbl { font-size: 13px; color: var(--text); }
.ib.x { font-size: 18px; justify-content: center; }

/* ---------- escenario ---------- */
#stage { position: relative; flex: none; align-self: center; overflow: hidden; background: #000; }
#cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--gold3); padding: 2px 6px 1px; clip-path: var(--notch); box-shadow: 0 2px 0 var(--gold2); }
.lab.one { animation: pop .18s steps(3) both; }
@keyframes pop { from { transform: translate(-50%, 6px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
#toasts { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: min(92%, 460px); }
.toast { display: flex; align-items: center; gap: 8px; background: var(--ink2); border: 3px solid var(--line); padding: 6px 10px; font-size: 14px; color: var(--text); clip-path: var(--notch); animation: tin .25s steps(4) both; }
.toast.card { border-color: var(--gold); }
.toast.item { border-color: var(--cyan); }
.toast.out { animation: tout .4s steps(4) both; }
.toast .ico { width: 22px; height: 22px; image-rendering: pixelated; flex: none; }
@keyframes tin { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tout { to { transform: translateY(-10px); opacity: 0; } }

/* ---------- panel (diálogo + inventario) ---------- */
#panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 10px; width: 100%; max-width: 880px; align-self: center; }
#dlg { display: none; flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border: 3px solid var(--line); clip-path: var(--notch); padding: 10px 12px 12px; position: relative; -webkit-user-select: text; user-select: text; cursor: pointer; }
body.talk #dlg { display: block; }
body.talk #idle { display: none; }
#dlgHead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
#face { width: 40px; height: 40px; image-rendering: pixelated; border: 2px solid var(--line); background: var(--panel2); flex: none; }
#who { font-size: 16px; letter-spacing: .03em; }
#txt { font-size: 18px; line-height: 1.38; color: var(--text); text-wrap: pretty; }
#opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.opt { text-align: left; background: var(--panel2); border: 0; padding: 9px 10px; font-size: 16px; line-height: 1.3; display: flex; gap: 10px; align-items: baseline; clip-path: var(--notch); box-shadow: inset 0 -3px 0 #1a1438; }
.opt:hover, .opt:focus-visible { background: #3a2f70; }
.opt:active { transform: translateY(2px); }
.opt .k { flex: none; color: var(--ink); background: var(--gold); font-size: 12px; padding: 1px 5px; }
.opt.done { opacity: .7; }

.tmenu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(420px, 100%); }

.prog { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
.bin { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border: 0; background: var(--panel2); font-size: 15px; line-height: 1.2; clip-path: var(--notch); box-shadow: inset 0 -4px 0 #1a1438; }

@media (max-width: 560px) { .ib .lbl { display: none; } #place { font-size: 12px; } }

/* ---------- apuntes ---------- */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { flex: 1; min-width: 56px; padding: 8px 6px; border: 0; background: var(--panel2); font-weight: 700; font-size: 15px; color: var(--muted); clip-path: var(--notch); }
.tab.on { background: var(--tc); color: var(--ink); }

.cards { display: flex; flex-direction: column; gap: 8px; }
.ncard { background: #efe7d3; color: #1d2a57; padding: 10px 12px 12px; clip-path: var(--notch); box-shadow: inset 0 -4px 0 #c9bd9d; }

.final { text-align: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

function update(dt) {

  // BIT sigue al jugador
  const b = RT.bit, p = RT.player;
  if (G.f.bit && RT.actors.includes(b) && !b.fixed) {
    const tx = p.x - 18 * p.dir, ty = p.y - 3;
    b.x += (tx - b.x) * Math.min(1, dt * 2.5); b.y += (ty - b.y) * Math.min(1, dt * 2.5);
    b.dir = p.dir;
  }

  if (sc.props) for (const p of sc.props) if (!p.show || p.show()) list.push(p);
  list.sort((a, b) => (a.y + (a.z || 0)) - (b.y + (b.z || 0)));

  for (const L of RT.layers) if (L.front) g.drawImage(L.c, -Math.round(cam * L.f), 0);

    x: 'Inglaterra, *1780-1840*. Llegan la *máquina de vapor* (James Watt), la *energía hidráulica* y la *mecanización*. Se pasa de una economía basada en la *agricultura* a otra basada en la *industria*: del taller a la fábrica.\nEl vapor mueve locomotoras, barcos y máquinas de las fábricas: viajes más rápidos, mejor comunicación y más comodidades materiales.' },
  pobreza: { ut: 1, t: 'El lado oscuro de la Industria 1.0', w: 'habla con el niño de la mina.',
    x: 'Al principio la revolución industrial *agudizó la pobreza*: los trabajadores no tenían seguridad, protección ni leyes laborales. Muchos adultos y *niños* trabajaban sin descanso en las *minas de carbón*, la materia prima que movía la industria y el transporte.' },
  rev2: { ut: 1, t: '2ª revolución industrial · Industria 2.0', w: 'devuelve la luz a la ciudad de 1880.',
    x: 'Desde *1870*. La *electricidad* y el *petróleo* se usan como fuente de energía para la *producción en masa*: producción en serie y *cadena de montaje*. Inglaterra, EE. UU. y Alemania lideran por sus avances científico-técnicos.\nCaracterísticas: expansión geográfica, producción en serie, transporte (ferrocarril, *tranvía eléctrico*, barcos de acero, turbina de vapor, *automóvil* y *avión*), nuevos materiales y energías, y grandes avances en *telecomunicaciones*.' },
  materiales2: { ut: 1, t: 'Bases de la 2ª RI: materiales y ciencia', w: 'ayuda al capataz de la fábrica de 1880.',
    x: '*Nuevos materiales*: acero, aluminio, zinc, níquel y cromo, caucho vulcanizado y plásticos.\n*Ciencia y química*: vacunas, antibióticos y pasteurización; fertilizantes para la agricultura y explosivos (que acabarían haciendo posible el armamento nuclear). Edison inventa el *fonógrafo*, el primer aparato que grababa y reproducía sonido.' },
  rev3: { ut: 1, t: '3ª revolución industrial · Industria 3.0', w: 'arranca el ordenador del laboratorio de 1975.',
    x: 'Década de *1970*: la *era de la información*. Llegan la *automatización*, las *TIC*, los sistemas electrónicos y la *informática*: se extienden los ordenadores y, más tarde, *Internet*. En el trabajo aparecen los *PLC* (autómatas programables) y los robots.\nLos *transistores* (de silicio) son la base de la informática. Empieza la *descarbonización* con energías renovables.' },
  rev4: { ut: 1, t: '4ª revolución industrial · Industria 4.0', w: 'recorre la fábrica inteligente.',
    x: 'Desde *2011*. Impulsada por los *datos*, la *conectividad* y las mejoras en *robótica*: producción automatizada e interconectada (*Internet de las cosas*).\nTecnologías disruptivas: 1) conectividad, datos y potencia de cálculo (nube, Internet, blockchain, sensores); 2) análisis e inteligencia (aprendizaje automático); 3) realidad virtual y aumentada, robótica y vehículos guiados autónomos; 4) ingeniería avanzada (fabricación aditiva, renovables, nanopartículas).\nGran reto: *recapacitar* al personal de las empresas tradicionales.' },
  ventajas4: { ut: 1, t: 'Ventajas de la Industria 4.0', w: 'pregunta a la ingeniera de la fábrica 4.0.',
    x: 'Productos y servicios más accesibles, *cadenas de suministro* más eficientes y *menos desperdicio*. La *pandemia* aceleró la digitalización (operaciones sin contacto).\n*Ecoeficiencia*: acciones basadas en datos en la producción, mejoras en costes, agilidad y calidad, y menos consumo, emisiones y residuos.' },
  saltos: { ut: 1, t: 'Cuatro saltos (resumen)', w: 'calibra la máquina del tiempo al final de la UT1.',
    x: '1ª · *vapor y mecanización* → del taller a la fábrica.\n2ª · *electricidad y cadena de montaje* → producción en masa.\n3ª · *electrónica e informática* → ordenadores, PLC y robots.\n4ª · *datos y conectividad* → sistemas ciberfísicos.\nCada revolución se apoya en la anterior. *La cuarta no añade máquinas: añade información sobre ellas.*' },
  digitalizar: { ut: 1, t: 'Digitalizar no es comprar tecnología', w: 'no caigas en la trampa del vendedor robot.',
    x: 'Si un procedimiento es innecesariamente complicado, digitalizarlo produce un procedimiento innecesariamente complicado... *y además digital*. Primero hay que entender y simplificar el proceso; después, elegir la tecnología.' },
  sobredig: { ut: 1, t: 'Sobredigitalización', w: 'no caigas en la trampa del vendedor robot.',
    x: 'Proceso de incorporar tecnologías digitales de forma *excesiva, forzada o innecesaria*, hasta el punto en que los inconvenientes (*complejidad, costes, exclusión*) superan claramente a los beneficios reales que aporta la tecnología.' },
  cps: { ut: 1, t: 'Sistemas ciberfísicos (CPS)', w: 'arregla el sistema de refrigeración de la fábrica 4.0.',
    x: 'Combinan *hardware, software y redes* para interactuar con el mundo físico y controlarlo a partir de la recogida de datos. Usan *sensores y actuadores* inteligentes para automatizar y tomar decisiones *en tiempo real*. La industria queda ciberconectada y guarda la información en la nube.' },
  ciclo: { ut: 1, t: 'El ciclo de un sistema ciberfísico', w: 'arregla el sistema de refrigeración de la fábrica 4.0.',
    x: '1 *Sensor*: mide una magnitud real (temperatura, presencia, peso, acceso).\n2 *Red*: transporta el dato hasta donde se procesa.\n3 *Decisión*: compara, calcula o predice, y decide.\n4 *Actuador*: ejecuta sobre el mundo físico.' },
  usoscps: { ut: 1, t: 'Usos de los sistemas ciberfísicos', w: 'habla con la ingeniera tras arreglar la refrigeración.',
    x: 'Robots industriales colaborativos, edificios inteligentes, vehículos autónomos (AGV), monitorización de pacientes en tiempo real, mapeo de la actividad del cerebro, transporte y tráfico seguros, alimentos rastreables, energía fiable y sostenible.\nTambién: *ciberseguridad* (comunicaciones cifradas, vigilancia de redes), *militar*, *agricultura* (drones, riego inteligente, robots agrícolas), *aeroespacial* y fábricas totalmente automatizadas (*dark factory*).' },
  gemelo: { ut: 1, t: 'Gemelo digital', w: 'toca el holograma de la fábrica 4.0.',
    x: '*Qué es*: réplica virtual de un objeto, espacio o proceso, alimentada con *datos en tiempo real*.\n*Para qué sirve*: simular, predecir y optimizar sin tocar el original: *¿qué pasaría si…?*\n*Qué lo distingue*: no es un plano ni un modelo 3D: *está vivo*. Si cambia el original, cambia el gemelo.' },
  itot: { ut: 1, t: 'Entornos IT y OT', w: 'reconcilia a los equipos de oficina y de planta.',
    x: '*IT* (tecnologías de la información): datos, ordenadores de oficina, correo, facturación, clientes. Protege sobre todo la información.\n*OT* (tecnología operativa): máquinas, sensores, PLC y robots de la planta. Debe funcionar sin parar y con seguridad física.\nSon *dos mundos con lógicas opuestas que hoy se conectan*.' },
  convergencia: { ut: 1, t: 'Convergencia IT/OT', w: 'reconcilia a los equipos de oficina y de planta.',
    x: 'Consigue que las organizaciones *reduzcan gastos* en hardware y software, *mejoren la eficiencia*, automaticen procesos y tengan *más trazabilidad*.\n*Beneficios*: flujo de datos entre el mundo digital y el físico, visión integral y decisiones más ágiles, optimizar procesos y *prever fallos*.\n*Desafíos*: obstáculos tecnológicos, capacidad del elemento humano y *riesgos de seguridad* (una red mal protegida crea vulnerabilidades en ambos sistemas).' },
  extremo: { ut: 1, t: 'Digitalizar de extremo a extremo', w: 'pregunta a la ingeniera de la fábrica 4.0.',
    x: 'Consiste en implementar tecnologías digitales en *todas o algunas* de las operaciones de una empresa industrial: del diseño y la compra de materiales a la fabricación, la logística y la atención al cliente.' },
  quinta: { ut: 1, t: '¿Una 5ª revolución industrial?', w: 'termina la aventura.',
    x: 'Pregunta abierta del curso. La tecnología ya está aquí (datos, nube, IA, robots). Se habla de *Industria 5.0* cuando esa tecnología se pone *al servicio de las personas y del planeta*: centrada en las personas, sostenible y resiliente. Y sin sobredigitalizar.' },

  /* ---------------- UT2 ---------------- */
  tdh: { ut: 2, t: 'Tecnologías digitales habilitadoras (TDH)', w: 'habla con la guía holográfica de la Expo.',
    x: 'Herramientas que permiten a las empresas *transformarse digitalmente* y formar parte del nuevo modelo de negocio de la *Industria 4.0*. El *mundo digital* es el entorno en el que se emplean.\nGeneran beneficios técnicos y económicos a empresas de todos los tamaños, *especialmente a las pymes*.' },
  tdhpara: { ut: 2, t: '¿Qué habilitan las TDH?', w: 'habla con la guía holográfica de la Expo.',
    x: 'Permiten *innovaciones revolucionarias* en procesos, productos y servicios, y facilitan *nuevos negocios y mercados*.\nComo son *transversales*, mejoran la productividad del personal y *reducen tiempos* de producción.' },
  empleo: { ut: 2, t: '¿Destruyen o crean empleo?', w: 'escucha el debate de la plaza de la Expo.',
    x: 'Debate abierto: las TDH *eliminan* puestos (tareas repetitivas, atención telefónica…) y *crean* otros nuevos (técnicos, analistas, mantenimiento de robots…). Lo seguro es que *exigen formación* del personal.' },
  bigdata2: { ut: 2, t: 'Big Data (como TDH)', w: 'visita la pantalla de datos del pabellón de conectividad.',
    x: 'Tecnologías de *procesamiento masivo de datos* que ayudan a resolver problemas al obtener información significativa.\n*Personas*: una app de salud que analiza pasos, ritmo cardíaco y sueño para dar pautas de hábitos.\n*Empresas*: un supermercado que estudia las compras de miles de clientes para decidir ofertas según la temporada.\n*Educación*: análisis de resultados e interacción.' },
  g5: { ut: 2, t: 'Redes 5G', w: 'prueba el coche conectado del pabellón.',
    x: 'Hacen posible *interconectar* muchos aparatos de forma inalámbrica. Consumen menos red, son *más rápidas* y tienen *menor latencia* que el 4G.\nAplicaciones: vehículos inteligentes conectados, conectividad *IoT*, streaming de vídeo y realidad virtual.' },
  gnss: { ut: 2, t: 'GPS · GNSS', w: 'ayuda al explorador a encontrar su dron.',
    x: 'El *GNSS* es el conjunto de sistemas de satélites que dan *posición, velocidad y hora exacta* en cualquier parte del mundo. Funciona por *triangulación*: con la distancia a varios satélites se calcula el único punto posible.\nPrecisión: *3–10 m* (civil) y *centímetros* (militar).\nLimitaciones: señal débil en zonas urbanas, montañosas o con mal tiempo.' },
  ia2: { ut: 2, t: 'Inteligencia artificial (como TDH)', w: 'visita el puesto de IA del pabellón de máquinas.',
    x: 'Desarrollo de *métodos y algoritmos* que permiten a los ordenadores comportarse de manera inteligente. Requiere un *tiempo de entrenamiento* para analizar las grandes cantidades de datos que obtiene.' },
  mldl: { ut: 2, t: 'Machine learning y deep learning', w: 'clasifica los proyectos del puesto de IA.',
    x: '*Machine learning*: métodos que detectan patrones automáticamente al analizar datos. *Necesita datos previamente estructurados* (p. ej., estimar la cosecha de tomates a partir de tablas de medidas).\n*Deep learning*: procesa *grandes volúmenes de datos sin estructurar* (imágenes, vídeo, sonido) y aprende en profundidad (p. ej., detectar coches en un vídeo). No necesita que los datos estén estructurados.' },
  xr: { ut: 2, t: 'Realidades inmersivas: VR, AR y RM', w: 'ponte las gafas del pabellón de máquinas.',
    x: 'Replican el mundo físico con una experiencia digital para mejorar la experiencia del usuario.\n*Realidad virtual (VR)*: te sumerge por completo en un entorno generado por ordenador y te *aísla del mundo real*.\n*Realidad aumentada (AR)*: añade información digital *sobre* el mundo real.\n*Realidad mixta (RM)*: combina elementos virtuales con el entorno real y permite *interactuar con ambos a la vez*.\nUso típico: *formación* segura, como los simulacros de incendio con extintores.' },
  cobot: { ut: 2, t: 'Robótica colaborativa (cobots)', w: 'observa el brazo robótico que trabaja con la operaria.',
    x: 'Brazos automatizados capaces de trabajar *con seres humanos* de forma colaborativa y segura. Se programan para *tareas repetitivas*, peligrosas o no ergonómicas, y para *evitar accidentes y colisiones*. Interactúan con el entorno y usan IA para aprender patrones.' },
  autonomos: { ut: 2, t: 'Robótica autónoma', w: 'habla sobre el robotaxi del pabellón.',
    x: 'Son *sistemas ciberfísicos basados en sensores*.\n*Robots industriales*: tareas específicas en líneas de producción.\n*Robots autónomos*: se mueven, perciben su entorno y *toman decisiones sin intervención humana* directa (sensores + IA + control en tiempo real).\nEjemplos: almacenes robotizados y *vehículos autónomos* (taxis sin conductor en San Francisco).' },
  blockchain: { ut: 2, t: 'Blockchain', w: 'descubre la trampa en el monumento de la cadena.',
    x: 'Base de datos *compartida y segura* donde la información se guarda en *bloques encadenados*, imposibles de modificar sin que todos lo vean. Sirve para *transacciones de datos verificadas*.\nAporta: *transparencia* (todos ven lo mismo), *seguridad* (no se altera sin dejar rastro) y *confianza sin intermediarios*.' },
  dlt: { ut: 2, t: 'Cómo funciona la blockchain', w: 'descubre la trampa en el monumento de la cadena.',
    x: 'Las transacciones se registran en un *libro mayor* que se reparte entre los *nodos* de una red pública o privada: es la *tecnología de contabilidad distribuida (DLT)*. Los nodos reciben *tokens* como incentivo por actualizar la cadena.\nEjemplos: *Bitcoin* (moneda sin bancos), *Everledger* (diamantes), *IBM Food Trust* (alimentos del origen al súper), *Guardtime* (datos sanitarios y públicos), *UNICEF* (donaciones).' },
  servicios: { ut: 2, t: 'TDH en la prestación de servicios', w: 'visita el puesto de atención al cliente.',
    x: 'Las TDH reorganizan los modelos de empresa tradicionales hacia un paradigma basado en la digitalización. *Exigen formar* al personal y eliminan la necesidad de personas en algunos trabajos tradicionales.\nEjemplo: *chatbot frente a teleoperadores*. El chatbot de Jazztel personaliza la atención con una sensación muy humana y *ahorra contratación* en el centro de atención al usuario.' },

  /* ---------------- UT3 ---------------- */
  nube: { ut: 3, t: '¿Qué es la nube?', w: 'habla con Nimbo en el muelle de Nubópolis.',
    x: '*El ordenador de otra persona, al que accedemos por internet.* Es un servicio que ofrece almacenamiento masivo, aplicaciones y mantenimiento de equipos *fuera de la empresa*. Permite acceder a la información *desde cualquier lugar o dispositivo* con conexión a internet.' },
  historia3: { ut: 3, t: 'Breve historia de la nube', w: 'ordena los monolitos del muelle.',
    x: '*1960*: John McCarthy imagina la informática vendida como un servicio público.\n*1999*: Salesforce ofrece una aplicación a través de internet.\n*2002*: Amazon lanza *AWS* (almacenamiento y computación por internet).\n*2009*: Google, Microsoft y otras empresas ofrecen cloud computing.' },
  almacen: { ut: 3, t: 'Almacenamiento en la nube', w: 'consigue la mochila de Nimbo.',
    x: 'Como un *disco duro en internet*. Cero preocupaciones técnicas: el proveedor mantiene los ordenadores y los protege. *Tus cosas viajan contigo*: móvil en la guagua, tablet en el sofá, portátil en el instituto. *Casi imposible perder nada*: hay copias automáticas en varios lugares. ¿Sin espacio? Pides más *con un clic* (y pagas), como una mochila que crece.' },
  computing: { ut: 3, t: 'Cloud computing', w: 'mira las tres pantallas flotantes del muelle.',
    x: 'Entrega recursos informáticos *al instante por internet*: los servicios están en otras ubicaciones y *no se procesan en tu ordenador*.\n*Streaming* (Netflix, Spotify, YouTube), *redes sociales y mensajería* (Instagram, WhatsApp: si pierdes el móvil, todo reaparece al iniciar sesión) y *videojuegos en la nube* (Xbox Cloud, GeForce NOW: un servidor lejano procesa los gráficos y a ti te llega el vídeo).' },
  datacenter: { ut: 3, t: 'Centros de datos', w: 'visita el centro de datos submarino.',
    x: 'La nube funciona en *data centers*: edificios formados por *miles de equipos* electrónicos que gestionan una enorme cantidad de datos cada día, con refrigeración, energía de respaldo y seguridad.' },
  submarino: { ut: 3, t: 'Centros de datos submarinos y espaciales', w: 'habla con la técnica del centro submarino.',
    x: 'La infraestructura se instala en un recipiente hermético y se *sumerge en el agua*.\n*Ventajas*: el agua asegura la disipación del calor (*ahorro en refrigeración*) y pueden abastecerse de *energía sostenible* (con una fuente de respaldo).\n*Desafíos*: *mantenimiento más complicado* y *alto coste de conectividad*.\n¿Y en el espacio? Varias empresas lo estudian por la falta de energía, aunque los lanzamientos de cohetes contaminan mucho.' },
  saas: { ut: 3, t: 'SaaS · Software como servicio', w: 'atiende a los clientes del Restaurante La Nube.',
    x: 'Todo montado: *solo recibes el servicio* (como comer en un restaurante: no cocinas ni limpias).\nEjemplos: *Gmail, Netflix, Dropbox, Spotify*.\nCoste de contratación: *alto (++)*. Coste de mantenimiento: *casi nulo (– –)*.' },
  paas: { ut: 3, t: 'PaaS · Plataforma como servicio', w: 'atiende a los clientes del Restaurante La Nube.',
    x: 'Te dan el *servidor funcionando* y *tú creas el software* (alquilas un restaurante ya montado y pones tus recetas).\nCoste de contratación: *medio (–)*. Mantenimiento: *algo (+)*: mantener servidores funcionando requiere personal de guardia.' },
  iaas: { ut: 3, t: 'IaaS · Infraestructura como servicio', w: 'atiende a los clientes del Restaurante La Nube.',
    x: 'Alquilas un *servidor vacío* en internet: tú lo mantienes online y tú instalas el software (alquilas *el local vacío*).\nCoste de contratación: *bajo (– – –)*. Mantenimiento: *alto (+++)*. A cambio, más control y *privacidad*. Hay empresas que ofrecen servidores cloud a bajo coste (p. ej., Arsys).' },
  despliegue: { ut: 3, t: 'Modelos de despliegue', w: 'habla con la meteoróloga de la Torre de las capas.',
    x: '*Nube pública*: la infraestructura es de un proveedor y se comparte entre muchos clientes.\n*Nube privada*: dedicada a una sola organización (más control).\n*Nube híbrida*: combina pública y privada.\n*Nube comunitaria*: la comparten organizaciones con intereses comunes.' },
  capas: { ut: 3, t: 'Cloud, fog, edge y mist', w: 'reparte los datos por las capas de la torre.',
    x: 'Dónde se gestionan los datos:\n*Cloud (nube)*: grandes centros de datos lejanos; enorme capacidad, pero más latencia.\n*Fog (niebla)*: nodos intermedios cerca de la red local (un barrio, una fábrica).\n*Edge (borde)*: en el propio dispositivo o junto a él: respuesta inmediata.\n*Mist (bruma)*: en los propios sensores, que filtran datos antes de enviarlos.\n*Cuanto más cerca del dato, menos latencia.*' },
  ventajas3: { ut: 3, t: 'Ventajas de la nube', w: 'supera la tormenta de la Torre de las capas.',
    x: '*Ahorro de costes*, *tarificación por uso*, *almacenamiento ilimitado*, equipos de *última gama*, *seguridad* en la red, soporte al cliente *24/7* y *actualizaciones automáticas* de las que se ocupa el proveedor.' },
  riesgos3: { ut: 3, t: 'Desventajas de la nube', w: 'supera la tormenta de la Torre de las capas.',
    x: '*Poco control* sobre la infraestructura. *Riesgos de seguridad*: hackeos si la gestión es deficiente (como el acceso no autorizado a una base de datos de clientes de un gran banco). *Dependencia de la conexión a internet*, que se vuelve un problema con cortes de luz o de red.' },

  /* ---------------- UT4 ---------------- */
  ia: { ut: 4, t: '¿Qué es la inteligencia artificial?', w: 'habla con Musa, la conservadora del museo.',
    x: 'La *ciencia que intenta crear un sistema complejo capaz de pensar y actuar por sí mismo*. Una de sus finalidades es comprobar si puede *imitar el comportamiento humano* en razonamiento, planificación y percepción.\n¿Qué nos hace humanos? *Descartes* («Pienso, luego existo», *Discurso del método*, 1637) ya se planteó si un sistema mecánico complejo podría imitar el pensamiento.' },
  debilfuerte: { ut: 4, t: 'IA débil e IA fuerte', w: 'responde a las preguntas de Musa.',
    x: '*IA débil (o estrecha)*: creada para *aplicaciones específicas*; sirve para realizar una tarea concreta y para formular hipótesis sobre cómo funciona la mente humana.\n*IA fuerte (o general)*: no simularía una mente, *sería una mente*: pensar, razonar, emitir juicios, planificar, aprender nuevas habilidades y comunicarse por sí sola. ¿Sería más humana que los humanos?' },
  turing: { ut: 4, t: 'Alan Turing y su test', w: 'haz la prueba de la cabina A/B del museo.',
    x: '*Alan Turing* (1912-1954), padre de la inteligencia artificial, estudió la capacidad de las máquinas para *simular la conducta humana*. En su test, si una persona conversa a ciegas con una máquina y *no sabe distinguirla* de un humano, la máquina supera la prueba.' },
  historia4: { ut: 4, t: 'Orígenes de la IA', w: 'ordena la línea del tiempo del museo.',
    x: '*1956*: nacimiento oficial; se acuña el término «inteligencia artificial». *Logic Theorist*, primer programa de IA, demuestra teoremas.\n*1966*: *ELIZA*, primer chatbot; simulaba ser psicoterapeuta con procesamiento de lenguaje natural.\n*1997*: *Deep Blue* (IBM) vence a Garry Kasparov al ajedrez.\n*2016*: *AlphaGo* vence a Lee Sedol al Go, mucho más complejo: arranca el boom del *deep learning*.' },
  aplicaciones4: { ut: 4, t: 'Ejemplos de aplicación de la IA', w: 'mira la vitrina de aplicaciones del museo.',
    x: 'Sistemas de *reconocimiento de voz y rostro*; *análisis de imágenes* para comparar e identificar patrones (p. ej., en medicina); *motores de búsqueda* con respuestas más precisas; *chatbots* y asistentes virtuales en móviles y altavoces; *creación de contenido*: imagen y vídeo a partir de un prompt o una referencia.' },
  prompt: { ut: 4, t: 'El prompt y sus entradas', w: 'monta un prompt en el laboratorio.',
    x: 'Un *prompt* es la instrucción o entrada que se le da a un modelo de IA para obtener una respuesta. Lo más común es el texto, pero hay más: *imágenes, audio/voz, vídeo en tiempo real, sensores* (presión, temperatura, aceleración), *datos biométricos, geolocalización, datos de red, sensores ambientales*…\n*Prompt multimodal*: recibe varias fuentes a la vez (vídeo con sonido, sensores, imagen…).' },
  noestruct: { ut: 4, t: 'La IA gestiona datos no estructurados', w: 'monta un prompt en el laboratorio.',
    x: 'Igual que a una persona le llegan estímulos del exterior (tengo hambre, tengo frío, tengo sueño…), la IA trabaja con *datos no estructurados*: imágenes, sonido, vídeo o texto libre, que no vienen ordenados en tablas.' },
  aprende: { ut: 4, t: '¿Cómo aprende la IA?', w: 'entrena la máquina de tomates del laboratorio.',
    x: 'Ingiere *grandes cantidades de datos de entrenamiento etiquetados*, busca *correlaciones y patrones* y los usa para *predecir* estados futuros. Así aprende a conversar a partir de textos, o a reconocer objetos revisando millones de imágenes de ejemplo.' },
  buena: { ut: 4, t: 'Dónde es buena la IA (y dónde no)', w: 'clasifica las tareas de la doctora Neura.',
    x: '*Buena* cuando: hay *muchos datos*, se necesita *rapidez*, se busca *precisión* (cálculos, diagnósticos, predicciones) o son *tareas repetitivas* (clasificar documentos, revisar imágenes, preguntas frecuentes).\n*No tan buena* en: *creatividad pura o intuición*, *empatía real y emociones*, y contextos con *poca información o datos confusos* (improvisar).' },

function gline(g, x0, y0, x1, y1) {

/* ---------- El Teide sobre el mar de nubes ---------- */
function paintTeide(P, o) {
  const w = P.w, N = Noise(o.seed || 3), dawn = !!o.dawn, base = o.base, px = o.px, py = o.py;
  if (!o.noSky) {
    if (dawn) P.vgrad(0, 0, w, base + 12, ['#101a4a', '#2d3a86', '#7a5aa8', '#e07892', '#ffad74', '#ffe2a6']);
    else P.vgrad(0, 0, w, base + 12, ['#05051a', '#0c1036', '#161f55', '#233274', '#34488f']);
    if (!dawn) { ART.milky(P, 0, 0, w, base, 7, '#b4c0ff', .15, .26); ART.stars(P, 0, 0, w, base - 4, Math.round(w * .9), 9); }
    else ART.stars(P, 0, 0, w, 36, Math.round(w * .12), 9, ['#ffffff', '#dfe6ff']);
    if (o.moon) ART.moon(P, o.moon[0], o.moon[1], o.moonR || 6);
    if (o.sun) ART.sun(P, o.sun[0], o.sun[1], o.sunR || 9, '#fffbe8', '#ffd98a', '#ff9a62', .85);
  }
  const col = dawn ? '#3b2c5c' : '#11142e', lit = dawn ? '#9a5f7e' : '#2c3464', dark = dawn ? '#2b2048' : '#0b0c22';
  const hs = [];
  for (let x = 0; x < w; x++) {
    const d = x - px;
    let y = py + Math.pow(Math.abs(d), 1.07) * (d < 0 ? .37 : .34);
    y += Math.abs(d) > 7 ? 4 : Math.abs(d) * .57;
    y = Math.min(y, py + 25 + Math.abs(x - (px - 46)) * .43);
    y += (N.fbm(x * .07) - .5) * 4;
    y = Math.round(y); hs.push(y);
    P.rect(x, y, 1, base + 30 - y, col);
  }
  for (let x = 1; x < w - 1; x++) {
    const y = hs[x]; if (y >= base + 6) continue;
    if (x > px - 2 && hs[x + 1] >= y) P.rect(x, y, 1, 2, lit);
    if (N.n1(x * .55) > .7) P.drect(x, y + 4, 1, base - y, dark, .55);
    if (y < py + 9) P.p(x, y + 1, dawn ? '#ffd8c8' : '#8e9ccc');
  }
  if (o.domes) for (const dx of o.domes) {
    const y = hs[clamp(dx, 0, w - 1)];
    P.rect(dx - 3, y - 3, 7, 4, dawn ? '#f0d8d8' : '#9aa6cc'); P.circle(dx, y - 3, 3, dawn ? '#fff0ea' : '#c4cde8'); P.rect(dx, y - 6, 1, 3, dawn ? '#6a4a6a' : '#3a4270');
  }
  if (!o.noClouds) ART.cloudSea(P, 0, base - 8, w, 28, dawn ? ['#fff4e8', '#f4b8a8', '#b47f9e'] : ['#b0bbe4', '#7b87ba', '#4b5486'], (o.seed || 3) + 1);
  return hs;
}

async function talkMartha() {
  if (G.f.motor) {
    await say('martha', '¡Escucha los telares! Con el vapor, una sola máquina mueve toda la fábrica. ¡Gracias por la ayuda!');
    await say('martha', 'Oye, ¿qué es esa luz tan rara que ha salido junto a los campos?');
    return;
  }
  if (!G.f.metMartha) {
    G.f.metMartha = 1;
    await say('martha', '¡Una cara nueva! Y qué ropa tan rara... ¿Vienes a buscar trabajo en la fábrica?');
    await say('pj', 'Más o menos... vengo de muy lejos. ¿Qué es esa máquina gigante?');
    await say('martha', '¡La máquina de vapor del señor Watt! La joya de Inglaterra: una sola máquina mueve todos los telares de la fábrica.');
    await say('martha', 'Pero hoy está parada: el horno está frío y la caldera, seca. Sin *carbón* y sin *agua* no hay vapor.');
    objective('Consigue *carbón* para el horno y *agua* para la caldera de la máquina de vapor.');
  }
  const asked = G.f.mAsk || (G.f.mAsk = {});
  for (; ;) {
    const r = await choose([
      { t: '¿Cómo funciona la máquina?', v: 0, done: asked[0] },
      { t: '¿Qué ha cambiado con estas máquinas?', v: 1, done: asked[1] },
      { t: '¿El vapor sirve para algo más?', v: 2, done: asked[2] },
      { t: 'Voy a por el carbón y el agua.', v: 3 },
    ], 'pj');
    asked[r] = 1;
    if (r === 0) { await say('martha', 'El carbón calienta el agua de la caldera. El vapor empuja el pistón, el pistón mueve el balancín y el balancín hace girar la rueda.'); await say('martha', 'Fuego convertido en movimiento. ¡Eso es la *mecanización*!'); }
    else if (r === 1) { await say('martha', 'Antes cada artesano trabajaba en su taller, o en el campo. Ahora trabajamos juntos en las fábricas, al ritmo de las máquinas.'); await say('martha', 'Inglaterra está pasando de vivir de la *agricultura* a vivir de la *industria*.'); }
    else if (r === 2) { await say('martha', '¡Para todo! Dicen que pronto habrá carros de vapor sobre raíles, locomotoras, y barcos de vapor que no esperarán al viento.'); await say('martha', 'Viajes más rápidos, mejor comunicación, más comodidades... El mundo se va a quedar pequeño.'); }
    else break;
  }
}
async function talkTom() {
  if (!G.f.tomTalk) {
    await say('tom', '¿Tú también vienes a la mina? No te lo aconsejo...');
  }
  const asked = G.f.tAsk || (G.f.tAsk = {});
  for (; ;) {
    const r = await choose([
      { t: '¿Cuántos años tienes?', v: 0, done: asked[0] },
      { t: '¿Cuántas horas trabajas?', v: 1, done: asked[1] },
      { t: '¿No vas a la escuela?', v: 2, done: asked[2] },
      { t: '¿Puedo coger un poco de carbón?', v: 3 },
    ], 'pj');
    asked[r] = 1;
    if (r === 0) await say('tom', 'Diez. Empecé a los ocho. Aquí abajo hay muchos niños: cabemos por los túneles más estrechos.');
    else if (r === 1) await say('tom', 'Catorce horas, de sol a sol. Si alguien protesta, lo echan. Nadie nos protege.');
    else if (r === 2) await say('tom', '¿Escuela? Eso es para los hijos de los dueños. Mi familia necesita lo poco que gano.');
    else {
      await say('tom', 'Coge un poco con la pala, venga. Pero que no te vea el capataz.');
      await say('tom', 'El carbón mueve las fábricas y los barcos... y a nosotros nos quita la salud.');
      if (!G.f.tomTalk) { G.f.tomTalk = 1; await say('bit', 'La primera revolución industrial trajo progreso, pero al principio *agudizó la pobreza*: sin seguridad, sin leyes laborales y con niños trabajando en las minas.'); learn('pobreza'); }
      break;
    }
  }
}
async function engineLook() {
  if (G.f.motor) { await say('pj', 'La máquina de vapor funciona a pleno rendimiento. ¡Qué ruido!'); return; }
  await say('pj', 'Una máquina de vapor enorme: horno, caldera, pistón, balancín y un volante gigante.');
  const falta = [];
  if (!G.f.fuego) falta.push('*carbón* en el horno'); if (!G.f.caldera) falta.push('*agua* en la caldera');

}
async function engineFeed(what) {
  if (what === 'carbon') { drop('carbon'); G.f.fuego = 1; sfx('zap'); await say('pj', 'Echo el carbón al horno y... ¡el fuego prende!'); }
  else { drop('agua'); G.f.caldera = 1; sfx('splash'); await say('pj', 'Vierto el agua en la caldera.'); }
  if (G.f.fuego && G.f.caldera) await startEngine();
  else await say('pj', G.f.fuego ? 'Ahora falta el agua para la caldera.' : 'Ahora falta el carbón para el horno.');
}
async function startEngine() {

  await wait(900);

}

async function talkClara() {

async function startUnit(u, fromTitle) {

}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
